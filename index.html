<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NOVA AI | Powered by RaoSahab</title>
    <style>
        :root {
            --bg-dark: #05010b;
            --neon-purple: #9d4edd;
            --neon-glow: #c77dff;
            --glass-card: rgba(10, 3, 20, 0.25);
            --glass-border: rgba(199, 125, 255, 0.15);
            --text-main: #f8f9fa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100dvh;
            background: #000000;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(157, 78, 221, 0.15);
        }

        /* Fullscreen Mascot Background Wall */
        .mascot-wallpaper {
            position: absolute;
            inset: 0;
            background: url('file_00000000519482109897efcb371a5a26.png') no-repeat center center;
            background-size: cover;
            opacity: 0.72;
            z-index: 1;
            pointer-events: none;
            filter: contrast(1.18) brightness(0.92);
        }

        .overlay-gradient {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(5, 1, 11, 0.6) 0%, rgba(5, 1, 11, 0.12) 35%, rgba(5, 1, 11, 0.75) 85%, #05010b 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* Header */
        .top-bar {
            padding: 16px 20px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            border-bottom: 1px solid rgba(199, 125, 255, 0.08);
            background: rgba(5, 1, 11, 0.4);
            backdrop-filter: blur(10px);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .menu-toggle-btn {
            background: rgba(30, 15, 50, 0.5);
            border: 1px solid var(--glass-border);
            color: #e0aaff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.9rem;
            backdrop-filter: blur(8px);
        }

        .brand-col {
            display: flex;
            flex-direction: column;
        }

        .brand-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-name {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 0 12px rgba(199, 125, 255, 0.8);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #00ffcc;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ffcc;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 12px #00ffcc; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .status-tag {
            font-size: 0.65rem;
            color: var(--neon-glow);
            opacity: 0.85;
            font-weight: 500;
            letter-spacing: 0.5px;
            margin-top: 1px;
        }

        .header-buttons {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .action-chip {
            background: rgba(30, 15, 50, 0.5);
            border: 1px solid var(--glass-border);
            color: #e0aaff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.2s ease;
        }

        .action-chip:active {
            transform: scale(0.95);
            background: rgba(157, 78, 221, 0.3);
        }

        #installBtn {
            display: none;
            background: linear-gradient(135deg, #7b2cbf, #ff007f);
            color: #ffffff;
            border: none;
        }

        /* User Profile Pill */
        .user-pill {
            display: none;
            align-items: center;
            gap: 6px;
            background: rgba(30, 15, 50, 0.7);
            border: 1px solid var(--glass-border);
            padding: 3px 10px 3px 3px;
            border-radius: 20px;
            backdrop-filter: blur(8px);
        }

        .user-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            object-fit: cover;
        }

        .user-signout {
            background: transparent;
            border: none;
            color: #ff4d6d;
            font-size: 0.65rem;
            cursor: pointer;
            font-weight: 600;
        }

        /* Sliding History Sidebar Drawer */
        .sidebar-drawer {
            position: absolute;
            top: 0;
            left: -100%;
            width: 80%;
            max-width: 320px;
            height: 100dvh;
            background: rgba(8, 2, 18, 0.95);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--glass-border);
            z-index: 100;
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.8);
        }

        .sidebar-drawer.open {
            left: 0;
        }

        .sidebar-header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(199, 125, 255, 0.1);
        }

        .sidebar-title {
            font-size: 1rem;
            font-weight: 700;
            color: #e0aaff;
            letter-spacing: 1px;
        }

        .sidebar-close {
            background: transparent;
            border: none;
            color: #c77dff;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .sidebar-new-chat-btn {
            margin: 15px 20px;
            background: linear-gradient(135deg, #7b2cbf, #9d4edd);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 15px rgba(157, 78, 221, 0.3);
        }

        .sidebar-history-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 15px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-item {
            padding: 12px 14px;
            background: rgba(20, 8, 35, 0.6);
            border: 1px solid rgba(199, 125, 255, 0.1);
            border-radius: 12px;
            font-size: 0.82rem;
            color: #f1e6ff;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.2s;
        }

        .history-item:hover, .history-item.active {
            background: rgba(157, 78, 221, 0.25);
            border-color: var(--neon-glow);
        }

        .sidebar-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 90;
            display: none;
        }

        .sidebar-backdrop.show {
            display: block;
        }

        /* Chat Stream */
        .chat-stream {
            flex: 1;
            overflow-y: auto;
            padding: 15px 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            z-index: 10;
            scroll-behavior: smooth;
        }

        .chat-stream::-webkit-scrollbar {
            display: none;
        }

        .msg-bubble {
            max-width: 85%;
            padding: 13px 17px;
            border-radius: 18px;
            font-size: 0.9rem;
            line-height: 1.5;
            backdrop-filter: blur(6px);
            word-wrap: break-word;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .msg-bubble.ai {
            background: var(--glass-card);
            border: 1px solid var(--glass-border);
            color: #f1e6ff;
            align-self: flex-start;
            border-top-left-radius: 4px;
        }

        .msg-bubble.ai a {
            color: #ff4d6d;
            font-weight: bold;
            text-decoration: underline;
        }

        .msg-bubble.user {
            background: rgba(123, 44, 191, 0.35);
            border: 1px solid rgba(224, 170, 255, 0.2);
            color: #ffffff;
            align-self: flex-end;
            border-top-right-radius: 4px;
        }

        .msg-image {
            max-width: 100%;
            border-radius: 12px;
            margin-bottom: 8px;
            display: block;
            border: 1px solid rgba(199, 125, 255, 0.3);
        }

        /* Preview container for selected images */
        .preview-container {
            padding: 5px 18px 0;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            z-index: 10;
        }

        .preview-thumb-wrap {
            position: relative;
            width: 45px;
            height: 45px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--neon-glow);
            flex-shrink: 0;
        }

        .preview-thumb-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .preview-remove {
            position: absolute;
            top: 2px;
            right: 2px;
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            border-radius: 50%;
            width: 15px;
            height: 15px;
            font-size: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Bottom Control Bar */
        .bottom-section {
            padding: 10px 18px 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 10;
            background: linear-gradient(to top, #05010b 85%, transparent);
        }

        .input-pill-box {
            background: rgba(15, 5, 25, 0.5);
            border: 1.5px solid rgba(199, 125, 255, 0.25);
            border-radius: 30px;
            padding: 6px 8px 6px 14px;
            display: flex;
            align-items: center;
            backdrop-filter: blur(14px);
            box-shadow: 0 0 20px rgba(157, 78, 221, 0.15);
        }

        .text-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 0.92rem;
            outline: none;
            padding: 8px 4px;
        }

        .text-input::placeholder {
            color: rgba(224, 170, 255, 0.4);
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: #c77dff;
            font-size: 1.15rem;
            padding: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .icon-btn:active {
            transform: scale(0.9);
        }

        .action-send-btn {
            background: linear-gradient(135deg, #9d4edd, #c77dff);
            color: #ffffff;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 12px rgba(199, 125, 255, 0.4);
            transition: transform 0.15s ease;
            margin-left: 4px;
            flex-shrink: 0;
        }

        .action-send-btn:active {
            transform: scale(0.9);
        }

        .footer-branding {
            text-align: center;
            font-size: 0.65rem;
            color: rgba(224, 170, 255, 0.4);
            letter-spacing: 0.8px;
            font-weight: 500;
            margin-top: 2px;
        }

        .footer-branding a {
            color: #c77dff;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="mascot-wallpaper"></div>
        <div class="overlay-gradient"></div>

        <!-- Sliding History Sidebar Drawer -->
        <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
        <div class="sidebar-drawer" id="sidebarDrawer">
            <div class="sidebar-header">
                <span class="sidebar-title">✦ Chat History</span>
                <button class="sidebar-close" id="sidebarClose">✕</button>
            </div>
            <button class="sidebar-new-chat-btn" id="sidebarNewChat">+ New Chat Session</button>
            <div class="sidebar-history-list" id="sidebarHistoryList">
                <!-- Dynamic Chat Sessions will load here -->
            </div>
        </div>

        <div class="top-bar">
            <div class="header-left">
                <button class="menu-toggle-btn" id="menuToggleBtn" title="Chat History">☰</button>
                <div class="brand-col">
                    <div class="brand-row">
                        <span class="brand-name">NOVA AI</span>
                        <div class="pulse-dot"></div>
                    </div>
                    <span class="status-tag">System Online. Ready for Chaos. ⚡</span>
                </div>
            </div>
            <div class="header-buttons">
                <button class="action-chip" id="installBtn">📲 Install</button>
                
                <!-- Google Sign In Button & User Profile -->
                <button class="action-chip" id="googleSignInBtn" style="background: linear-gradient(135deg, #4285F4, #34A853); color: white; border: none;">Sign In</button>
                <div class="user-pill" id="userPill">
                    <img id="userAvatar" class="user-avatar" src="" alt="Avatar">
                    <button class="user-signout" id="googleSignOutBtn">Sign Out</button>
                </div>
            </div>
        </div>

        <div class="chat-stream" id="chatStream">
            <div class="msg-bubble ai">
                System online. RaoSahab ki NOVA active hai. Bol kya scene hai? ⚡
            </div>
        </div>

        <!-- Image Previews Container -->
        <div class="preview-container" id="previewContainer"></div>

        <div class="bottom-section">
            <div class="input-pill-box">
                <input type="file" id="imageInput" accept="image/*" multiple style="display: none;">
                <button class="icon-btn" id="attachBtn" title="Upload Images">📎</button>
                <button class="icon-btn" id="micBtn" title="Voice Input">🎙️</button>
                <input type="text" id="userInput" class="text-input" placeholder="Type prompt or command..." autocomplete="off">
                <button class="action-send-btn" id="sendBtn" title="Send">➔</button>
            </div>
            <div class="footer-branding">
                Powered by RaoSahab | Explore <a href="https://chaos-exe.vercel.app" target="_blank">CHAOS.EXE</a>
            </div>
        </div>
    </div>

    <!-- Firebase, Auth & Firestore SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, query, where, orderBy, serverTimestamp, setDoc, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBFZgeMPYIdpTR92DUkVFz-7h1X2xOdH3A",
          authDomain: "nova-ai-57072.firebaseapp.com",
          projectId: "nova-ai-57072",
          storageBucket: "nova-ai-57072.firebasestorage.app",
          messagingSenderId: "672770051843",
          appId: "1:672770051843:web:ef21e65c3bc383d232a336",
          measurementId: "G-3VGYTZTB9E"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        const googleSignInBtn = document.getElementById('googleSignInBtn');
        const googleSignOutBtn = document.getElementById('googleSignOutBtn');
        const userPill = document.getElementById('userPill');
        const userAvatar = document.getElementById('userAvatar');

        let currentUserToken = null;
        window.currentUserId = null;
        window.currentChatSessionId = 'session_' + Date.now();

        googleSignInBtn.addEventListener('click', async () => {
            try {
                const result = await signInWithPopup(auth, provider);
                currentUserToken = await result.user.getIdToken();
            } catch (error) {
                console.error("Auth Error:", error);
            }
        });

        googleSignOutBtn.addEventListener('click', async () => {
            await signOut(auth);
            currentUserToken = null;
            window.currentUserId = null;
            document.getElementById('sidebarHistoryList').innerHTML = '';
        });

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                googleSignInBtn.style.display = 'none';
                userPill.style.display = 'flex';
                userAvatar.src = user.photoURL || '';
                currentUserToken = await user.getIdToken();
                window.currentUserId = user.uid;
                
                if (window.loadUserSessionsList) {
                    window.loadUserSessionsList(user.uid);
                }
            } else {
                googleSignInBtn.style.display = 'block';
                userPill.style.display = 'none';
                currentUserToken = null;
                window.currentUserId = null;
                document.getElementById('sidebarHistoryList').innerHTML = '';
            }
        });

        window.getCurrentAuthToken = async () => {
            if (auth.currentUser) {
                return await auth.currentUser.getIdToken();
            }
            return currentUserToken;
        };

        // Firestore Session & Topic Management
        window.saveMessageToFirestore = async (role, textContent) => {
            if (!window.currentUserId) return;
            try {
                // Save message
                await addDoc(collection(db, "chats"), {
                    userId: window.currentUserId,
                    sessionId: window.currentChatSessionId,
                    role: role,
                    content: textContent,
                    createdAt: serverTimestamp()
                });

                // If it's the first user message, set it as session title topic
                if (role === 'user') {
                    const sessionRef = doc(db, "sessions", window.currentChatSessionId);
                    const sessSnap = await getDoc(sessionRef);
                    if (!sessSnap.exists()) {
                        const titleText = textContent.length > 32 ? textContent.substring(0, 32) + '...' : textContent;
                        await setDoc(sessionRef, {
                            userId: window.currentUserId,
                            title: titleText,
                            createdAt: serverTimestamp()
                        });
                    }
                }

                if (window.loadUserSessionsList) {
                    window.loadUserSessionsList(window.currentUserId);
                }
            } catch (e) {
                console.error("Error saving message:", e);
            }
        };

        window.loadUserSessionsList = async (uid) => {
            try {
                const q = query(collection(db, "sessions"), where("userId", "==", uid), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                
                const historyList = document.getElementById('sidebarHistoryList');
                historyList.innerHTML = '';
                
                if (querySnapshot.empty) {
                    historyList.innerHTML = '<div style="color: rgba(224,170,255,0.4); font-size: 0.75rem; text-align: center; margin-top: 20px;">Koi history nahi hai abhi.</div>';
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const sess = docSnap.data();
                    const sId = docSnap.id;

                    const item = document.createElement('div');
                    item.className = `history-item ${sId === window.currentChatSessionId ? 'active' : ''}`;
                    item.textContent = sess.title || 'Nova Chat Session';
                    item.onclick = () => {
                        window.switchChatSession(sId, uid);
                    };
                    historyList.appendChild(item);
                });
            } catch (e) {
                console.error("Error loading sessions:", e);
            }
        };

        window.switchChatSession = async (sessionId, uid) => {
            window.currentChatSessionId = sessionId;
            const chatStream = document.getElementById('chatStream');
            chatStream.innerHTML = `
                <div class="msg-bubble ai">
                    Session loaded. Bol kya scene hai? ⚡
                </div>
            `;
            window.messageHistory = [];

            try {
                const q = query(collection(db, "chats"), where("userId", "==", uid), where("sessionId", "==", sessionId), orderBy("createdAt", "asc"));
                const querySnapshot = await getDocs(q);

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    if (data.role === 'user') {
                        window.appendUserMessage(data.content, []);
                        window.messageHistory.push({ role: "user", content: [{ text: data.content }] });
                    } else if (data.role === 'model') {
                        window.appendHtmlMessage(data.content, 'ai');
                        window.messageHistory.push({ role: "model", content: [{ text: data.content }] });
                    }
                });
                chatStream.scrollTop = chatStream.scrollHeight;
                document.getElementById('sidebarDrawer').classList.remove('open');
                document.getElementById('sidebarBackdrop').classList.remove('show');
                
                if (window.loadUserSessionsList) {
                    window.loadUserSessionsList(uid);
                }
            } catch (e) {
                console.error("Error switching session:", e);
            }
        };
    </script>

    <script>
        const chatStream = document.getElementById('chatStream');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const menuToggleBtn = document.getElementById('menuToggleBtn');
        const sidebarDrawer = document.getElementById('sidebarDrawer');
        const sidebarBackdrop = document.getElementById('sidebarBackdrop');
        const sidebarClose = document.getElementById('sidebarClose');
        const sidebarNewChat = document.getElementById('sidebarNewChat');
        const installBtn = document.getElementById('installBtn');
        const attachBtn = document.getElementById('attachBtn');
        const imageInput = document.getElementById('imageInput');
        const previewContainer = document.getElementById('previewContainer');
        const micBtn = document.getElementById('micBtn');

        window.messageHistory = [];
        let selectedImages = [];
        let deferredPrompt;

        menuToggleBtn.addEventListener('click', () => {
            sidebarDrawer.classList.add('open');
            sidebarBackdrop.classList.add('show');
        });

        sidebarClose.addEventListener('click', () => {
            sidebarDrawer.classList.remove('open');
            sidebarBackdrop.classList.remove('show');
        });

        sidebarBackdrop.addEventListener('click', () => {
            sidebarDrawer.classList.remove('open');
            sidebarBackdrop.classList.remove('show');
        });

        sidebarNewChat.addEventListener('click', () => {
            window.currentChatSessionId = 'session_' + Date.now();
            window.messageHistory = [];
            selectedImages = [];
            previewContainer.innerHTML = '';
            chatStream.innerHTML = `
                <div class="msg-bubble ai">
                    Naya chat session shuru ho gaya hai. Bol kya scene hai? ⚡
                </div>
            `;
            sidebarDrawer.classList.remove('open');
            sidebarBackdrop.classList.remove('show');
            if (window.currentUserId && window.loadUserSessionsList) {
                window.loadUserSessionsList(window.currentUserId);
            }
        });

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block';
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') installBtn.style.display = 'none';
                deferredPrompt = null;
            }
        });

        attachBtn.addEventListener('click', () => imageInput.click());

        imageInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            if (!files.length) return;

            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (uploadEvent) => {
                    const base64String = uploadEvent.target.result;
                    selectedImages.push({
                        mimeType: file.type || "image/jpeg",
                        data: base64String.split(',')[1]
                    });
                    renderPreviews();
                };
                reader.readAsDataURL(file);
            });
            imageInput.value = '';
        });

        function renderPreviews() {
            previewContainer.innerHTML = '';
            selectedImages.forEach((imgObj, index) => {
                const wrap = document.createElement('div');
                wrap.className = 'preview-thumb-wrap';
                wrap.innerHTML = `
                    <img src="data:${imgObj.mimeType};base64,${imgObj.data}" alt="preview">
                    <button class="preview-remove" onclick="removeImage(${index})">✕</button>
                `;
                previewContainer.appendChild(wrap);
            });
        }

        window.removeImage = function(index) {
            selectedImages.splice(index, 1);
            renderPreviews();
        }

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'hi-IN';
            recognition.continuous = false;
            recognition.interimResults = false;

            micBtn.addEventListener('click', () => {
                recognition.start();
                userInput.placeholder = "Listening...";
            });

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                userInput.value = userInput.value ? userInput.value + ' ' + transcript : transcript;
                userInput.placeholder = "Type prompt or command...";
            };

            recognition.onerror = () => { userInput.placeholder = "Type prompt or command..."; };
            recognition.onend = () => { userInput.placeholder = "Type prompt or command..."; };
        } else {
            micBtn.style.display = 'none';
        }

        async function handleSendMessage() {
            const text = userInput.value.trim();
            if (!text && selectedImages.length === 0) return;

            let currentImagesSnapshot = [...selectedImages];
            window.appendUserMessage(text, currentImagesSnapshot);
            
            userInput.value = '';
            selectedImages = [];
            previewContainer.innerHTML = '';
            scrollToBottom();

            let userContentParts = [];
            if (text) userContentParts.push({ text: text });
            currentImagesSnapshot.forEach(img => {
                userContentParts.push({
                    inlineData: { mimeType: img.mimeType, data: img.data }
                });
            });

            window.messageHistory.push({ role: "user", content: userContentParts });

            if (text && window.saveMessageToFirestore) {
                window.saveMessageToFirestore('user', text);
            }

            const loadingId = appendMessage("NOVA is cooking...", 'ai loading');
            scrollToBottom();

            try {
                let token = null;
                if (window.getCurrentAuthToken) {
                    token = await window.getCurrentAuthToken();
                }

                const headers = { 'Content-Type': 'application/json' };
                if (token) {
                    headers['Authorization'] = `Bearer ${token}`;
                }

                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({ messages: window.messageHistory })
                });

                const data = await response.json();
                const loadingElem = document.getElementById(loadingId);
                if (loadingElem) loadingElem.remove();

                if (response.status === 403) {
                    appendMessage("⚠️ Firewall Blocked: Access restricted or unauthorized request.", 'ai');
                    scrollToBottom();
                    return;
                }

                if (data.reply) {
                    window.appendHtmlMessage(data.reply, 'ai');
                    window.messageHistory.push({ role: "model", content: data.reply });

                    if (window.saveMessageToFirestore) {
                        window.saveMessageToFirestore('model', data.reply);
                    }
                } else if (data.error) {
                    appendMessage(`⚠️ Error: ${data.error}`, 'ai');
                } else {
                    appendMessage("Kuch gadbad ho gayi bhai!", 'ai');
                }

                scrollToBottom();

            } catch (error) {
                const loadingElem = document.getElementById(loadingId);
                if (loadingElem) loadingElem.remove();
                appendMessage("Server ke sath connection toot gaya!", 'ai');
                scrollToBottom();
            }
        }

        window.appendUserMessage = function(text, images) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'msg-bubble user';
            
            let htmlContent = '';
            if (images && images.length > 0) {
                images.forEach(img => {
                    htmlContent += `<img src="data:${img.mimeType};base64,${img.data}" class="msg-image">`;
                });
            }
            if (text) {
                htmlContent += `<div>${escapeHtml(text)}</div>`;
            }
            msgDiv.innerHTML = htmlContent;
            chatStream.appendChild(msgDiv);
        }

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            const msgId = 'msg_' + Date.now() + Math.random().toString(36).substr(2, 4);
            msgDiv.id = msgId;
            msgDiv.className = `msg-bubble ${sender}`;
            msgDiv.textContent = text;
            chatStream.appendChild(msgDiv);
            return msgId;
        }

        window.appendHtmlMessage = function(html, sender) {
            const msgDiv = document.createElement('div');
            const msgId = 'msg_' + Date.now() + Math.random().toString(36).substr(2, 4);
            msgDiv.id = msgId;
            msgDiv.className = `msg-bubble ${sender}`;
            msgDiv.innerHTML = html;
            chatStream.appendChild(msgDiv);
            return msgId;
        }

        function escapeHtml(string) {
            return string.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function scrollToBottom() {
            chatStream.scrollTop = chatStream.scrollHeight;
        }

        sendBtn.addEventListener('click', handleSendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSendMessage();
        });
    </script>
</body>
</html>
