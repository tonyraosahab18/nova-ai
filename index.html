<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NOVA AI | Powered by RaoSahab & Team</title>
    <style>
        :root {
            --bg-dark: #05010b;
            --neon-purple: #9d4edd;
            --neon-glow: #c77dff;
            --glass-card: rgba(15, 5, 25, 0.4);
            --glass-border: rgba(199, 125, 255, 0.18);
            --text-main: #f8f9fa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100dvh;
            background: #000000;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* Fullscreen Mascot Background Wall */
        .mascot-wallpaper {
            position: absolute;
            inset: 0;
            background: url('file_00000000519482109897efcb371a5a26.png') no-repeat center center;
            background-size: cover;
            opacity: 0.65;
            z-index: 1;
            pointer-events: none;
            filter: contrast(1.15) brightness(0.95);
        }

        .overlay-gradient {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(5, 1, 11, 0.6) 0%, rgba(5, 1, 11, 0.15) 35%, rgba(5, 1, 11, 0.75) 85%, #05010b 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* Header */
        .top-bar {
            padding: 18px 20px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .header-left {
            display: flex;
            flex-direction: column;
        }

        .brand-name {
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 0 12px rgba(199, 125, 255, 0.8);
        }

        .status-tag {
            font-size: 0.68rem;
            color: var(--neon-glow);
            opacity: 0.85;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .new-chat-btn {
            background: rgba(30, 15, 50, 0.5);
            border: 1px solid var(--glass-border);
            color: #e0aaff;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.2s ease;
        }

        .new-chat-btn:active {
            transform: scale(0.95);
            background: rgba(157, 78, 221, 0.3);
        }

        /* Chat Stream */
        .chat-stream {
            flex: 1;
            overflow-y: auto;
            padding: 15px 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            z-index: 10;
            scroll-behavior: smooth;
        }

        .chat-stream::-webkit-scrollbar {
            display: none;
        }

        .msg-bubble {
            max-width: 85%;
            padding: 13px 17px;
            border-radius: 18px;
            font-size: 0.9rem;
            line-height: 1.5;
            backdrop-filter: blur(12px);
            word-wrap: break-word;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
        }

        .msg-bubble.ai {
            background: var(--glass-card);
            border: 1px solid var(--glass-border);
            color: #f1e6ff;
            align-self: flex-start;
            border-top-left-radius: 4px;
        }

        .msg-bubble.ai a {
            color: #ff4d6d;
            font-weight: bold;
            text-decoration: underline;
        }

        .msg-bubble.user {
            background: linear-gradient(135deg, rgba(123, 44, 191, 0.75), rgba(157, 78, 221, 0.85));
            border: 1px solid rgba(224, 170, 255, 0.3);
            color: #ffffff;
            align-self: flex-end;
            border-top-right-radius: 4px;
        }

        /* Bottom Control Bar */
        .bottom-section {
            padding: 10px 18px 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
            background: linear-gradient(to top, #05010b 85%, transparent);
        }

        .input-pill-box {
            background: rgba(20, 8, 35, 0.6);
            border: 1.5px solid rgba(199, 125, 255, 0.3);
            border-radius: 30px;
            padding: 6px 8px 6px 18px;
            display: flex;
            align-items: center;
            backdrop-filter: blur(16px);
            box-shadow: 0 0 20px rgba(157, 78, 221, 0.2);
        }

        .text-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 0.92rem;
            outline: none;
            padding: 8px 0;
        }

        .text-input::placeholder {
            color: rgba(224, 170, 255, 0.45);
        }

        .action-send-btn {
            background: linear-gradient(135deg, #9d4edd, #c77dff);
            color: #ffffff;
            border: none;
            padding: 10px 18px;
            border-radius: 22px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 0 12px rgba(199, 125, 255, 0.4);
            transition: transform 0.15s ease;
        }

        .action-send-btn:active {
            transform: scale(0.93);
        }

        .footer-branding {
            text-align: center;
            font-size: 0.65rem;
            color: rgba(224, 170, 255, 0.4);
            letter-spacing: 0.8px;
            font-weight: 500;
            margin-top: 2px;
        }

        .footer-branding a {
            color: #c77dff;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="mascot-wallpaper"></div>
        <div class="overlay-gradient"></div>

        <div class="top-bar">
            <div class="header-left">
                <span class="brand-name">NOVA AI</span>
                <span class="status-tag">System Online. Ready for Chaos. ⚡</span>
            </div>
            <button class="new-chat-btn" id="clearBtn">+ New Chat</button>
        </div>

        <div class="chat-stream" id="chatStream">
            <div class="msg-bubble ai">
                System initialized. Main NOVA hoon—RaoSahab & Team dwara develop ki gayi advanced AI companion. Bataiye, aaj kis query ya task par kaam karna hai? ⚡
            </div>
        </div>

        <div class="bottom-section">
            <div class="input-pill-box">
                <input type="text" id="userInput" class="text-input" placeholder="Type your command to NOVA..." autocomplete="off">
                <button class="action-send-btn" id="sendBtn">Send ➔</button>
            </div>
            <div class="footer-branding">
                Powered by RaoSahab & Team | Explore <a href="https://chaos-exe.vercel.app" target="_blank">CHAOS.EXE</a>
            </div>
        </div>
    </div>

    <script>
        const chatStream = document.getElementById('chatStream');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const clearBtn = document.getElementById('clearBtn');

        let messageHistory = [];

        async function handleSendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            userInput.value = '';
            scrollToBottom();

            messageHistory.push({ role: "user", content: text });

            const loadingId = appendMessage("NOVA is cooking...", 'ai loading');
            scrollToBottom();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: messageHistory })
                });

                const data = await response.json();
                
                const loadingElem = document.getElementById(loadingId);
                if (loadingElem) loadingElem.remove();

                if (data.reply) {
                    appendHtmlMessage(data.reply, 'ai');
                    messageHistory.push({ role: "model", content: data.reply });
                } else if (data.error) {
                    appendMessage(`⚠️ Error: ${data.error}`, 'ai');
                } else {
                    appendMessage("Kuch gadbad ho gayi bhai!", 'ai');
                }

                scrollToBottom();

            } catch (error) {
                const loadingElem = document.getElementById(loadingId);
                if (loadingElem) loadingElem.remove();
                appendMessage("Server ke sath connection toot gaya!", 'ai');
                scrollToBottom();
            }
        }

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            const msgId = 'msg_' + Date.now() + Math.random().toString(36).substr(2, 4);
            msgDiv.id = msgId;
            msgDiv.className = `msg-bubble ${sender}`;
            msgDiv.textContent = text;
            chatStream.appendChild(msgDiv);
            return msgId;
        }

        function appendHtmlMessage(html, sender) {
            const msgDiv = document.createElement('div');
            const msgId = 'msg_' + Date.now() + Math.random().toString(36).substr(2, 4);
            msgDiv.id = msgId;
            msgDiv.className = `msg-bubble ${sender}`;
            msgDiv.innerHTML = html;
            chatStream.appendChild(msgDiv);
            return msgId;
        }

        function scrollToBottom() {
            chatStream.scrollTop = chatStream.scrollHeight;
        }

        sendBtn.addEventListener('click', handleSendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSendMessage();
        });

        clearBtn.addEventListener('click', () => {
            messageHistory = [];
            chatStream.innerHTML = `
                <div class="msg-bubble ai">
                    Session reset. RaoSahab & Team ki NOVA AI ready hai. Next command dijiye! ⚡
                </div>
            `;
        });
    </script>
</body>
</html>
