<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA AI ✦ Photorealistic Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f19',
                        panelBg: '#131826',
                        accent: '#6366f1'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-darkBg text-gray-100 font-sans h-screen flex flex-col overflow-hidden">

    <!-- Top Navigation Bar -->
    <header class="flex justify-between items-center px-6 py-4 border-b border-gray-800 bg-panelBg/50 backdrop-blur-md">
        <div class="flex items-center space-x-2">
            <span class="text-accent text-xl">✦</span>
            <h1 class="text-lg font-bold tracking-wide">NOVA AI</h1>
        </div>
        
        <div class="flex items-center space-x-4">
            <div id="userInfo" class="hidden flex items-center space-x-3">
                <img id="userAvatar" src="" alt="User" class="w-8 h-8 rounded-full border border-gray-700">
                <span id="userName" class="text-sm font-medium hidden sm:inline"></span>
                <button onclick="handleSignOut()" class="text-xs bg-red-500/10 text-red-400 hover:bg-red-500/20 px-3 py-1.5 rounded-lg transition">Sign Out</button>
            </div>
            <button id="signInBtn" onclick="handleGoogleSignIn()" class="flex items-center space-x-2 bg-white text-gray-900 px-4 py-1.5 rounded-lg text-sm font-semibold hover:bg-gray-100 transition shadow-sm">
                <i class="fab fa-google"></i>
                <span>Sign In</span>
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
        
        <!-- Sidebar: History & Saved Prompts -->
        <aside class="w-full md:w-80 border-r border-gray-800 bg-panelBg/30 flex flex-col hidden md:flex">
            <div class="p-4 border-b border-gray-800 flex justify-between items-center">
                <span class="text-xs font-semibold uppercase tracking-wider text-gray-400">Generation History</span>
                <button onclick="clearHistory()" class="text-gray-500 hover:text-red-400 text-xs"><i class="fas fa-trash-alt"></i></button>
            </div>
            <div id="historyList" class="flex-1 overflow-y-auto p-3 space-y-2 text-sm">
                <!-- Dynamic History Items -->
            </div>
        </aside>

        <!-- Central Studio Workspace -->
        <section class="flex-1 flex flex-col justify-between p-4 md:p-8 overflow-y-auto">
            
            <!-- Output Display Area -->
            <div id="outputContainer" class="flex-1 flex items-center justify-center p-4">
                <div id="welcomeState" class="text-center space-y-3 max-w-md">
                    <span class="text-4xl text-accent animate-pulse">✦</span>
                    <h2 class="text-xl font-semibold">What will you create today?</h2>
                    <p class="text-sm text-gray-400">Powered by FLUX.1-schnell for breathtaking photorealism.</p>
                </div>

                <!-- Generated Result Card -->
                <div id="resultCard" class="hidden relative group max-w-2xl w-full bg-panelBg rounded-2xl border border-gray-800 overflow-hidden shadow-2xl">
                    <img id="generatedImage" src="" alt="AI Output" class="w-full h-auto object-cover max-h-[60vh]">
                    
                    <!-- ChatGPT-Style Floating Action Bar -->
                    <div class="absolute bottom-4 right-4 flex items-center space-x-2 opacity-0 group-hover:opacity-100 transition duration-200 bg-black/70 backdrop-blur-md px-3 py-1.5 rounded-xl border border-white/10 shadow-lg">
                        <button onclick="downloadImage()" class="text-gray-200 hover:text-white flex items-center space-x-1.5 text-xs font-medium px-2 py-1 transition">
                            <i class="fas fa-download"></i>
                            <span>Download</span>
                        </button>
                    </div>
                </div>

                <!-- Loading State -->
                <div id="loadingState" class="hidden flex flex-col items-center space-y-3">
                    <div class="w-10 h-10 border-4 border-accent border-t-transparent rounded-full animate-spin"></div>
                    <p class="text-sm text-gray-400">Crafting high-resolution realism (~15-30s)...</p>
                </div>
            </div>

            <!-- Prompt Input Bar -->
            <div class="max-w-3xl w-full mx-auto mt-4">
                <div class="relative bg-panelBg border border-gray-800 rounded-2xl p-2 shadow-inner flex items-center">
                    <textarea id="promptInput" rows="1" placeholder="Imagine something extraordinary..." class="w-full bg-transparent text-gray-100 placeholder-gray-500 text-sm px-3 py-2 focus:outline-none resize-none max-h-32"></textarea>
                    <button onclick="generateImage()" id="generateBtn" class="bg-accent hover:bg-accent/90 text-white px-4 py-2.5 rounded-xl text-sm font-medium transition flex items-center space-x-1.5 ml-2">
                        <span>Generate</span>
                        <i class="fas fa-arrow-up"></i>
                    </button>
                </div>
                <div class="flex justify-between items-center px-2 mt-2 text-xs text-gray-500">
                    <span>Model: FLUX.1-schnell</span>
                    <span>No Watermark ✦ Pure Quality</span>
                </div>
            </div>

        </section>
    </main>

    <!-- Firebase & App Script Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Your Firebase Config Keys
        const firebaseConfig = {
          apiKey: "AIzaSyBFZgeMPYIdpTR92DUkVFz-7h1X2xOdH3A",
          authDomain: "nova-ai-57072.firebaseapp.com",
          projectId: "nova-ai-57072",
          storageBucket: "nova-ai-57072.firebasestorage.app",
          messagingSenderId: "672770051843",
          appId: "1:672770051843:web:ef21e65c3bc383d232a336",
          measurementId: "G-3VGYTZTB9E"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // Hugging Face API Key Integrated
        const HF_API_KEY = "Hf_LGGSyVZhVuPbatGfFaTlBySWnAduQnbTQS"; 
        const MODEL_URL = "https://api-inference.huggingface.co/models/black-forest-labs/FLUX.1-schnell";

        window.handleGoogleSignIn = async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error("Login Error:", error);
            }
        };

        window.handleSignOut = async () => {
            await signOut(auth);
        };

        onAuthStateChanged(auth, (user) => {
            const signInBtn = document.getElementById('signInBtn');
            const userInfo = document.getElementById('userInfo');
            if (user) {
                signInBtn.classList.add('hidden');
                userInfo.classList.remove('hidden');
                document.getElementById('userAvatar').src = user.photoURL;
                document.getElementById('userName').innerText = user.displayName.split(' ')[0];
                loadUserHistory();
            } else {
                signInBtn.classList.remove('hidden');
                userInfo.classList.add('hidden');
            }
        });

        let currentImageUrl = "";

        window.generateImage = async () => {
            const prompt = document.getElementById('promptInput').value.trim();
            if (!prompt) return;

            document.getElementById('welcomeState').classList.add('hidden');
            document.getElementById('resultCard').classList.add('hidden');
            document.getElementById('loadingState').classList.remove('hidden');
            document.getElementById('generateBtn').disabled = true;

            try {
                const response = await fetch(MODEL_URL, {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${HF_API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ inputs: prompt })
                });

                if (!response.ok) throw new Error("Image generation failed. Try again.");

                const blob = await response.blob();
                currentImageUrl = URL.createObjectURL(blob);

                document.getElementById('generatedImage').src = currentImageUrl;
                document.getElementById('loadingState').classList.add('hidden');
                document.getElementById('resultCard').classList.remove('hidden');

                saveToHistory(prompt, currentImageUrl);
            } catch (error) {
                console.error(error);
                alert("Error generating image. Server might be warming up, try again in 10 seconds.");
                document.getElementById('loadingState').classList.add('hidden');
                document.getElementById('welcomeState').classList.remove('hidden');
            } finally {
                document.getElementById('generateBtn').disabled = false;
            }
        };

        window.downloadImage = () => {
            if (!currentImageUrl) return;
            const a = document.createElement('a');
            a.href = currentImageUrl;
            a.download = `nova-ai-${Date.now()}.webp`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        };

        function saveToHistory(prompt, imgUrl) {
            let history = JSON.parse(localStorage.getItem('nova_history') || '[]');
            history.unshift({ prompt, imgUrl, time: Date.now() });
            localStorage.setItem('nova_history', JSON.stringify(history));
            renderHistory();
        }

        function loadUserHistory() {
            renderHistory();
        }

        function renderHistory() {
            const historyList = document.getElementById('historyList');
            let history = JSON.parse(localStorage.getItem('nova_history') || '[]');
            historyList.innerHTML = '';
            
            history.forEach((item) => {
                const div = document.createElement('div');
                div.className = "p-2.5 rounded-xl hover:bg-gray-800/50 cursor-pointer transition flex items-center space-x-3 truncate";
                div.innerHTML = `
                    <img src="${item.imgUrl}" class="w-10 h-10 rounded-lg object-cover">
                    <span class="text-xs text-gray-300 truncate">${item.prompt}</span>
                `;
                div.onclick = () => {
                    currentImageUrl = item.imgUrl;
                    document.getElementById('welcomeState').classList.add('hidden');
                    document.getElementById('resultCard').classList.remove('hidden');
                    document.getElementById('generatedImage').src = item.imgUrl;
                };
                historyList.appendChild(div);
            });
        }

        window.clearHistory = () => {
            localStorage.removeItem('nova_history');
            renderHistory();
        }

        renderHistory();
    </script>
</body>
</html>
