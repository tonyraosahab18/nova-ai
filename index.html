<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA AI - CHAOS.EXE</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #030007;
            --neon-purple: #9D4EDD;
            --neon-cyan: #00FFCC;
            --glass-bg: rgba(10, 3, 20, 0.85);
            --glass-border: rgba(157, 78, 221, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            background-image: radial-gradient(circle at 50% 15%, #1f083b 0%, var(--bg-deep) 75%);
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--glass-border);
        }

        .brand {
            font-weight: 800;
            font-size: 20px;
            letter-spacing: 1px;
            background: linear-gradient(45deg, #fff, var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Mascot Container with Blinking & Smile Animation */
        .mascot-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: auto;
            position: relative;
        }

        .mascot-circle {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: radial-gradient(circle, #2a0c4f 0%, #05010b 85%);
            border: 2px solid var(--neon-purple);
            box-shadow: 0 0 30px rgba(157, 78, 221, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            animation: floatMascot 4s ease-in-out infinite;
        }

        @keyframes floatMascot {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* Mascot Eyes & Shatir Smile */
        .mascot-eyes {
            display: flex;
            gap: 22px;
            margin-bottom: 12px;
            animation: blinkEyes 4s infinite;
        }

        .eye {
            width: 14px;
            height: 14px;
            background-color: var(--neon-cyan);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--neon-cyan);
        }

        @keyframes blinkEyes {
            0%, 96%, 100% { transform: scaleY(1); }
            98% { transform: scaleY(0.1); }
        }

        .mascot-smile {
            width: 36px;
            height: 16px;
            border-bottom: 3px solid var(--neon-purple);
            border-radius: 0 0 30px 30px;
            box-shadow: 0 4px 12px rgba(157, 78, 221, 0.8);
            transform: scale(0.9);
            animation: playfulSmile 3s ease-in-out infinite alternate;
        }

        @keyframes playfulSmile {
            0% { transform: scale(0.9) rotate(0deg); }
            100% { transform: scale(1.1) rotate(4deg); }
        }

        /* Dynamic Greeting Box */
        .greeting-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 16px 20px;
            border-radius: 14px;
            margin: 0 20px 12px 20px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            backdrop-filter: blur(12px);
            border-left: 4px solid var(--neon-cyan);
            line-height: 1.5;
        }

        /* Input Area */
        .input-container {
            padding: 16px 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border-top: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .input-box {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            padding: 12px 16px;
            border-radius: 30px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .send-btn {
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-cyan));
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(157, 78, 221, 0.5);
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">NOVA AI</div>
        <div style="font-size: 12px; color: var(--neon-cyan); font-weight: 700;">Wake: "Wake up Nova"</div>
    </header>

    <div class="mascot-container">
        <div class="mascot-circle">
            <div class="mascot-eyes">
                <div class="eye"></div>
                <div class="eye"></div>
            </div>
            <div class="mascot-smile"></div>
        </div>
    </div>

    <div class="greeting-card" id="dynamicGreeting">
        ⚡ Initializing system sequence...
    </div>

    <div class="input-container">
        <input type="text" class="input-box" id="userInput" placeholder="Type prompt or command...">
        <button class="send-btn" onclick="handleSend()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
    </div>

    <script>
        // Dynamic Full-Day Time & User Profile Greeting
        function loadUserGreeting() {
            const hour = new Date().getHours();
            
            // LocalStorage ya Login session se user ka naam fetch karega, agar nahi hai toh default "Navneet Yadav" uthayega
            const userName = localStorage.getItem('nova_user_name') || "Navneet Yadav";
            let greetingText = "";

            if (hour >= 4 && hour < 12) {
                // Morning Slot
                greetingText = `🌅 Good morning, ${userName}! Uth ja, system online hai aur aaj kuch bada phodna hai. 🔥`;
            } else if (hour >= 12 && hour < 17) {
                // Afternoon Slot
                greetingText = `☀️ Good afternoon, ${userName}! Momentum high rakh, kya task execute karna hai?`;
            } else if (hour >= 17 && hour < 21) {
                // Evening Slot
                greetingText = `🌆 Good evening, ${userName}! Shaam ka session shuru karein, bata kya scene hai?`;
            } else {
                // Night Slot
                greetingText = `🌙 Late night protocol active, ${userName}. Sannata hai, bata kya code ya project grind karna hai?`;
            }

            document.getElementById('dynamicGreeting').innerText = greetingText;
        }

        window.onload = loadUserGreeting;

        function handleSend() {
            const input = document.getElementById('userInput').value;
            if(!input) return;
            alert("Command received: " + input);
            document.getElementById('userInput').value = '';
        }
    </script>
</body>
</html>
