<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NOVA AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --transition-speed: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            --bg-dark: #05010b;
            --neon-purple: #9d4edd;
            --neon-glow: #c77dff;
            --neon-cyan: #00ffcc;
            --glass-card: rgba(10, 3, 20, 0.25);
            --glass-border: rgba(199, 125, 255, 0.2);
            --text-main: #ffffff;
            --particle-color: rgba(199, 125, 255, 0.8);
        }

        /* Dynamic Mood Themes with buttery smooth transitions */
        body.mode-1 {
            --neon-purple: #00ff88;
            --neon-glow: #70c1b3;
            --neon-cyan: #00ffd5;
            --bg-dark: #021114;
            --glass-card: rgba(2, 17, 20, 0.35);
            --glass-border: rgba(0, 255, 136, 0.3);
            --particle-color: rgba(0, 255, 136, 0.8);
        }

        body.mode-2 {
            --neon-purple: #9d4edd;
            --neon-glow: #c77dff;
            --neon-cyan: #00ffcc;
            --bg-dark: #05010b;
            --glass-card: rgba(10, 3, 20, 0.25);
            --glass-border: rgba(199, 125, 255, 0.2);
            --particle-color: rgba(199, 125, 255, 0.8);
        }

        body.mode-3 {
            --neon-purple: #ff3366;
            --neon-glow: #ff4d6d;
            --neon-cyan: #ff0055;
            --bg-dark: #140205;
            --glass-card: rgba(20, 2, 5, 0.4);
            --glass-border: rgba(255, 51, 102, 0.4);
            --particle-color: rgba(255, 51, 102, 0.9);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            letter-spacing: -0.01em;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: background-color var(--transition-speed);
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100dvh;
            background: #000000;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 40px var(--neon-purple);
            transition: box-shadow var(--transition-speed);
        }

        /* Perfect Locked Center Alignment for Mascot Wallpapers to prevent jumping */
        .mascot-bg-layer {
            position: absolute;
            inset: 0;
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            z-index: 1;
            pointer-events: none;
            filter: contrast(1.2) brightness(0.95);
            transition: opacity var(--transition-speed) ease-in-out;
            opacity: 0;
        }

        .mascot-bg-layer.active {
            opacity: 0.85;
        }

        .bg-mild { background-image: url('file_00000000032c820b9fb89695fa9372f5.png'); }
        .bg-savage { background-image: url('file_00000000519482109897efcb371a5a26.png'); }
        .bg-hyper { background-image: url('file_00000000f9e481f79a2979dd50632264.png'); }

        #particlesCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .overlay-gradient {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(5, 1, 11, 0.5) 0%, rgba(5, 1, 11, 0.1) 30%, rgba(5, 1, 11, 0.6) 85%, var(--bg-dark) 100%);
            z-index: 3;
            pointer-events: none;
            transition: background var(--transition-speed);
        }

        .top-bar {
            padding: 16px 20px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            border-bottom: 1px solid var(--glass-border);
            background: rgba(5, 1, 11, 0.35);
            backdrop-filter: blur(12px);
            transition: border-color var(--transition-speed);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-toggle-btn {
            background: var(--glass-card);
            border: 1px solid var(--glass-border);
            color: #f1e6ff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 700;
            backdrop-filter: blur(8px);
            transition: all var(--transition-speed);
        }

        .brand-col {
            display: flex;
            flex-direction: column;
        }

        .brand-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-name {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            color: #ffffff;
            text-shadow: 0 0 12px var(--neon-glow);
            transition: text-shadow var(--transition-speed);
        }

        .pulse-dot {
            width: 7px;
            height: 7px;
            background-color: var(--neon-cyan);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--neon-cyan);
            animation: pulse 2s infinite;
            transition: background-color var(--transition-speed), box-shadow var(--transition-speed);
        }

        .pulse-dot.offline {
            background-color: #ff3366 !important;
            box-shadow: 0 0 10px #ff3366 !important;
            animation: pulse-red 1.2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 12px var(--neon-cyan); }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        @keyframes pulse-red {
            0% { transform: scale(0.95); opacity: 0.7; }
            50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 14px #ff3366; }
            100% { transform: scale(0.95); opacity: 0.7; }
        }

        .status-tag {
            font-size: 0.7rem;
            color: var(--neon-glow);
            font-weight: 600;
            letter-spacing: 0.02em;
            margin-top: 2px;
            transition: color var(--transition-speed);
        }

        .header-buttons {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .action-chip {
            background: var(--glass-card);
            border: 1px solid var(--glass-border);
            color: #f1e6ff;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all var(--transition-speed);
        }

        #installBtn {
            display: none;
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-glow));
            color: #ffffff;
            border: none;
        }

        .user-pill {
            display: none;
            align-items: center;
            gap: 8px;
            background: var(--glass-card);
            border: 1px solid var(--glass-border);
            padding: 4px 12px 4px 4px;
            border-radius: 20px;
            backdrop-filter: blur(8px);
            transition: all var(--transition-speed);
        }

        .user-avatar {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            object-fit: cover;
        }

        .user-signout {
            background: transparent;
            border: none;
            color: #ff6b8b;
            font-size: 0.7rem;
            cursor: pointer;
            font-weight: 700;
        }

        /* Main Screen Live Volume/Brightness Style Vibe Bar */
        .live-vibe-bar {
            z-index: 10;
            padding: 8px 18px;
            background: rgba(5, 1, 11, 0.45);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            transition: border-color var(--transition-speed);
        }

        .vibe-label {
            font-size: 0.72rem;
            font-weight: 800;
            color: var(--neon-glow);
            letter-spacing: 0.04em;
            text-transform: uppercase;
            transition: color var(--transition-speed);
        }

        .slider-wrapper {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
        }

        .slider-wrapper input[type="range"] {
            width: 100%;
            -webkit-appearance: none;
            height: 6px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .slider-wrapper input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--neon-cyan);
            box-shadow: 0 0 15px var(--neon-cyan);
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), background var(--transition-speed), box-shadow var(--transition-speed);
        }

        .slider-wrapper input[type="range"]::-webkit-slider-thumb:active {
            transform: scale(1.35);
        }

        .vibe-badge {
            font-size: 0.75rem;
            font-weight: 800;
            color: #ffffff;
            min-width: 85px;
            text-align: right;
            padding: 3px 10px;
            background: var(--glass-card);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            backdrop-filter: blur(8px);
            transition: all var(--transition-speed);
        }

        .sidebar-drawer {
            position: absolute;
            top: 0;
            left: -100%;
            width: 80%;
            max-width: 320px;
            height: 100dvh;
            background: rgba(10, 3, 20, 0.95);
            backdrop-filter: blur(25px);
            border-right: 1px solid var(--glass-border);
            z-index: 100;
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1), border-color var(--transition-speed);
            display: flex;
            flex-direction: column;
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.8);
        }

        .sidebar-drawer.open {
            left: 0;
        }

        .sidebar-header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
        }

        .sidebar-title {
            font-size: 1rem;
            font-weight: 700;
            color: #f1e6ff;
        }

        .sidebar-close {
            background: transparent;
            border: none;
            color: var(--neon-glow);
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: color var(--transition-speed);
        }

        .sidebar-new-chat-btn {
            margin: 16px 20px 10px;
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-glow));
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 15px var(--neon-purple);
            transition: all var(--transition-speed);
        }

        .sidebar-history-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 16px 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .history-item {
            padding: 13px 15px;
            background: var(--glass-card);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            font-size: 0.86rem;
            font-weight: 600;
            color: #ffffff;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all var(--transition-speed);
        }

        .history-item.active {
            background: rgba(157, 78, 221, 0.35);
            border-color: var(--neon-glow);
        }

        .sidebar-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 90;
            display: none;
        }

        .sidebar-backdrop.show {
            display: block;
        }

        .chat-stream {
            flex: 1;
            overflow-y: auto;
            padding: 20px 18px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            z-index: 10;
            scroll-behavior: smooth;
        }

        .chat-stream::-webkit-scrollbar {
            display: none;
        }

        .msg-bubble {
            max-width: 88%;
            padding: 15px 18px;
            border-radius: 20px;
            font-size: 0.95rem;
            line-height: 1.6;
            font-weight: 600;
            backdrop-filter: blur(10px);
            word-wrap: break-word;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            transition: all var(--transition-speed);
        }

        .msg-bubble.ai {
            background: var(--glass-card);
            border: 1.5px solid var(--glass-border);
            color: #ffffff;
            align-self: flex-start;
            border-top-left-radius: 6px;
        }

        .msg-bubble.user {
            background: rgba(123, 44, 191, 0.4);
            border: 1.5px solid var(--glass-border);
            color: #ffffff;
            align-self: flex-end;
            border-top-right-radius: 6px;
        }

        .msg-image {
            max-width: 100%;
            border-radius: 12px;
            margin-bottom: 10px;
            display: block;
            border: 1px solid var(--glass-border);
        }

        .neon-time-widget {
            background: rgba(20, 8, 35, 0.85);
            border: 1px solid var(--neon-glow);
            border-radius: 16px;
            padding: 16px;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 0 20px var(--neon-glow);
            transition: all var(--transition-speed);
        }

        .widget-left {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .widget-time-display {
            font-size: 1.6rem;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 0 10px var(--neon-cyan);
        }

        .widget-date-display {
            font-size: 0.8rem;
            color: var(--neon-glow);
            font-weight: 700;
        }

        .widget-timezone {
            font-size: 0.72rem;
            color: rgba(224, 170, 255, 0.6);
        }

        .widget-clock-icon {
            font-size: 2.2rem;
        }

        .preview-container {
            padding: 6px 18px 0;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            z-index: 10;
        }

        .preview-thumb-wrap {
            position: relative;
            width: 48px;
            height: 48px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--neon-glow);
            flex-shrink: 0;
        }

        .preview-thumb-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .preview-remove {
            position: absolute;
            top: 2px;
            right: 2px;
            background: rgba(0,0,0,0.75);
            color: white;
            border: none;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            font-size: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bottom-section {
            padding: 12px 18px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
            background: linear-gradient(to top, var(--bg-dark) 80%, transparent);
            transition: background var(--transition-speed);
        }

        .input-pill-box {
            background: var(--glass-card);
            border: 1.5px solid var(--glass-border);
            border-radius: 32px;
            padding: 6px 8px 6px 14px;
            display: flex;
            align-items: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 25px var(--neon-purple);
            transition: all var(--transition-speed);
        }

        .text-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 600;
            outline: none;
            padding: 8px 4px;
        }

        .text-input::placeholder {
            color: rgba(224, 170, 255, 0.5);
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--neon-glow);
            font-size: 1.2rem;
            padding: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color var(--transition-speed);
        }

        .action-send-btn {
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-glow));
            color: #ffffff;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px var(--neon-glow);
            margin-left: 6px;
            flex-shrink: 0;
            transition: all var(--transition-speed);
        }

        .footer-branding {
            text-align: center;
            font-size: 0.72rem;
            color: rgba(224, 170, 255, 0.5);
            letter-spacing: 0.04em;
            font-weight: 600;
            margin-top: 2px;
        }

        .footer-branding a {
            color: var(--neon-glow);
            text-decoration: none;
            font-weight: 700;
            transition: color var(--transition-speed);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Dual Locked Background Layers for Smooth Crossfade Without Shifting -->
        <div class="mascot-bg-layer bg-mild" id="bgMild"></div>
        <div class="mascot-bg-layer bg-savage active" id="bgSavage"></div>
        <div class="mascot-bg-layer bg-hyper" id="bgHyper"></div>

        <!-- Floating Particles Canvas Animation -->
        <canvas id="particlesCanvas"></canvas>

        <div class="overlay-gradient"></div>

        <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
        <div class="sidebar-drawer" id="sidebarDrawer">
            <div class="sidebar-header">
                <span class="sidebar-title">✦ Settings & History</span>
                <button class="sidebar-close" id="sidebarClose">✕</button>
            </div>
            
            <button class="sidebar-new-chat-btn" id="sidebarNewChat">+ New Chat Session</button>
            <div class="sidebar-history-list" id="sidebarHistoryList"></div>
        </div>

        <div class="top-bar">
            <div class="header-left">
                <button class="menu-toggle-btn" id="menuToggleBtn" title="Chat Settings & History">☰</button>
                <div class="brand-col">
                    <div class="brand-row">
                        <span class="brand-name">NOVA AI</span>
                        <div class="pulse-dot" id="statusDot"></div>
                    </div>
                    <span class="status-tag" id="statusText">System online ⚡</span>
                </div>
            </div>
            <div class="header-buttons">
                <button class="action-chip" id="installBtn">📲 Install</button>
                <button class="action-chip" id="googleSignInBtn" style="background: linear-gradient(135deg, #4285F4, #34A853); color: white; border: none;">Sign In</button>
                <div class="user-pill" id="userPill">
                    <img id="userAvatar" class="user-avatar" src="" alt="Avatar">
                    <button class="user-signout" id="googleSignOutBtn">Sign Out</button>
                </div>
            </div>
        </div>

        <!-- Main Screen Smooth Volume-Style Vibe Slider Bar -->
        <div class="live-vibe-bar">
            <span class="vibe-label">⚡ VIBE:</span>
            <div class="slider-wrapper">
                <input type="range" id="mainRoastSlider" min="1" max="3" value="2" step="1">
            </div>
            <span class="vibe-badge" id="vibeBadge">Savage ⚡</span>
        </div>

        <div class="chat-stream" id="chatStream"></div>

        <div class="preview-container" id="previewContainer"></div>

        <div class="bottom-section">
            <div class="input-pill-box">
                <input type="file" id="imageInput" accept="image/*" multiple style="display: none;">
                <button class="icon-btn" id="attachBtn" title="Upload Images">📎</button>
                <input type="text" id="userInput" class="text-input" placeholder="Type prompt or command..." autocomplete="off">
                <button class="action-send-btn" id="sendBtn" title="Send">➔</button>
            </div>
            <div class="footer-branding">
                Powered by RaoSahab | Explore <a href="https://chaos-exe.vercel.app" target="_blank">CHAOS.EXE</a>
            </div>
        </div>
    </div>

    <!-- Firebase Script (Module) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBFZgeMPYIdpTR92DUkVFz-7h1X2xOdH3A",
          authDomain: "nova-ai-57072.firebaseapp.com",
          projectId: "nova-ai-57072",
          storageBucket: "nova-ai-57072.firebasestorage.app",
          messagingSenderId: "672770051843",
          appId: "1:672770051843:web:ef21e65c3bc383d232a336",
          measurementId: "G-3VGYTZTB9E"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const googleSignInBtn = document.getElementById('googleSignInBtn');
        const googleSignOutBtn = document.getElementById('googleSignOutBtn');
        const userPill = document.getElementById('userPill');
        const userAvatar = document.getElementById('userAvatar');

        let currentUserToken = null;
        window.currentFirebaseUser = null;

        googleSignInBtn.addEventListener('click', async () => {
            try {
                const result = await signInWithPopup(auth, provider);
                currentUserToken = await result.user.getIdToken();
            } catch (error) {
                console.error("Auth Error:", error);
            }
        });

        googleSignOutBtn.addEventListener('click', async () => {
            await signOut(auth);
            currentUserToken = null;
            window.currentFirebaseUser = null;
            window.loadCurrentSession();
            window.renderSidebarSessions();
        });

        onAuthStateChanged(auth, async (user) => {
            window.currentFirebaseUser = user;
            if (user) {
                googleSignInBtn.style.display = 'none';
                userPill.style.display = 'flex';
                userAvatar.src = user.photoURL || '';
                currentUserToken = await user.getIdToken();
                if(user.displayName) localStorage.setItem('nova_user_name', user.displayName);
            } else {
                googleSignInBtn.style.display = 'block';
                userPill.style.display = 'none';
                currentUserToken = null;
            }
            window.loadCurrentSession();
            window.renderSidebarSessions();
        });

        window.getCurrentAuthToken = async () => {
            if (auth.currentUser) return await auth.currentUser.getIdToken();
            return currentUserToken;
        };
    </script>

    <!-- App Logic Script -->
    <script>
        const chatStream = document.getElementById('chatStream');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const menuToggleBtn = document.getElementById('menuToggleBtn');
        const sidebarDrawer = document.getElementById('sidebarDrawer');
        const sidebarBackdrop = document.getElementById('sidebarBackdrop');
        const sidebarClose = document.getElementById('sidebarClose');
        const sidebarNewChat = document.getElementById('sidebarNewChat');
        const sidebarHistoryList = document.getElementById('sidebarHistoryList');
        const installBtn = document.getElementById('installBtn');
        const attachBtn = document.getElementById('attachBtn');
        const imageInput = document.getElementById('imageInput');
        const previewContainer = document.getElementById('previewContainer');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        
        const mainRoastSlider = document.getElementById('mainRoastSlider');
        const vibeBadge = document.getElementById('vibeBadge');
        const bgMild = document.getElementById('bgMild');
        const bgSavage = document.getElementById('bgSavage');
        const bgHyper = document.getElementById('bgHyper');
        const bodyElement = document.body;

        window.messageHistory = [];
        let selectedImages = [];
        let deferredPrompt;
        
        function getStorageKey() {
            const user = window.currentFirebaseUser;
            return user ? `nova_sessions_${user.uid}` : null;
        }

        let guestSessionStorage = { 'session_guest': { title: 'Current Session', messages: [] } };
        let currentSessionId = 'session_' + Date.now();

        const welcomeMessagesPool = [
            "System online. NOVA active hai! ⚡ Jyada bakchodi ki toh seedha roast khayega, baaki bol kya scene hai? 😎🔥",
            "System fully loaded! AI core online. Bataa aaj kya cook karna hai? 🚀✨",
            "NOVA operational. Focus high, excuses zero. Bata boss, kya task niptana hai? 🔥🎯"
        ];

        const roastLabels = { "1": "Mild 🌿", "2": "Savage ⚡", "3": "Nuclear 💥" };
        
        // Smooth Dynamic Mood, Theme, & Background Crossfade Handler without shifting mascot/text
        mainRoastSlider.addEventListener('input', (e) => {
            const val = e.target.value;
            vibeBadge.textContent = roastLabels[val] || "Savage ⚡";
            
            // Switch body classes for fluid theme transitions
            bodyElement.classList.remove('mode-1', 'mode-2', 'mode-3');
            bodyElement.classList.add(`mode-${val}`);

            // Crossfade Background Mascot Wallpapers smoothly
            bgMild.classList.remove('active');
            bgSavage.classList.remove('active');
            bgHyper.classList.remove('active');

            if (val === "1") bgMild.classList.add('active');
            else if (val === "2") bgSavage.classList.add('active');
            else if (val === "3") bgHyper.classList.add('active');
        });

        // Set default initial mode (Savage: Level 2)
        bodyElement.classList.add('mode-2');

        // -------------------------------------------------------------
        // Cyberpunk Floating Particles Animation Engine
        // -------------------------------------------------------------
        const canvas = document.getElementById('particlesCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const particles = [];
        const particleCount = 35;

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.5 + 1;
                this.speedX = (Math.random() - 0.5) * 0.8;
                this.speedY = -Math.random() * 0.8 - 0.2;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.y < 0 || this.x < 0 || this.x > canvas.width) {
                    this.reset();
                    this.y = canvas.height;
                }
            }
            draw() {
                ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--particle-color').trim() || 'rgba(199, 125, 255, 0.8)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < particleCount; i++) { particles.push(new Particle()); }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        function updateNetworkStatus() {
            if (navigator.onLine) {
                statusDot.classList.remove('offline');
                statusText.textContent = "System online ⚡";
            } else {
                statusDot.classList.add('offline');
                statusText.textContent = "System offline 🔌";
            }
        }

        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);
        setInterval(updateNetworkStatus, 3000);
        updateNetworkStatus();

        window.renderSidebarSessions = function() {
            const storageKey = getStorageKey();
            sidebarHistoryList.innerHTML = '';
            if (!storageKey) {
                sidebarHistoryList.innerHTML = '<div style="color: rgba(224,170,255,0.6); font-size: 0.8rem; text-align: center; margin-top: 25px; font-weight: 600;">🔒 Guest Mode Active</div>';
                return;
            }
            let sessions = JSON.parse(localStorage.getItem(storageKey) || '{}');
            Object.keys(sessions).sort().reverse().forEach(sId => {
                const sess = sessions[sId];
                const item = document.createElement('div');
                item.className = `history-item ${sId === currentSessionId ? 'active' : ''}`;
                item.textContent = sess.title || 'Nova Chat Session';
                item.onclick = () => switchSession(sId);
                sidebarHistoryList.appendChild(item);
            });
        }

        window.loadCurrentSession = function() {
            const storageKey = getStorageKey();
            chatStream.innerHTML = '';
            window.messageHistory = [];
            let sessions = storageKey ? JSON.parse(localStorage.getItem(storageKey) || '{}') : guestSessionStorage;
            if (storageKey && Object.keys(sessions).length > 0 && !sessions[currentSessionId]) {
                currentSessionId = Object.keys(sessions).sort().reverse()[0];
            }
            if (sessions[currentSessionId]?.messages?.length > 0) {
                sessions[currentSessionId].messages.forEach(msg => {
                    if (msg.role === 'user') {
                        appendUserMessage(msg.text, []);
                        window.messageHistory.push({ role: "user", content: [{ text: msg.text }] });
                    } else if (msg.role === 'model') {
                        appendHtmlMessage(msg.text, 'ai');
                        window.messageHistory.push({ role: "model", content: [{ text: msg.text }] });
                    }
                });
            } else {
                appendHtmlMessage(getRandomWelcomeMessage(), 'ai');
            }
            chatStream.scrollTop = chatStream.scrollHeight;
        }

        function saveMessageToStorage(role, text) {
            const storageKey = getStorageKey();
            if (!storageKey) {
                if (!guestSessionStorage[currentSessionId]) guestSessionStorage[currentSessionId] = { title: text.substring(0, 30), messages: [] };
                guestSessionStorage[currentSessionId].messages.push({ role, text });
                return;
            }
            let sessions = JSON.parse(localStorage.getItem(storageKey) || '{}');
            if (!sessions[currentSessionId]) sessions[currentSessionId] = { title: text.substring(0, 30), messages: [] };
            sessions[currentSessionId].messages.push({ role, text });
            localStorage.setItem(storageKey, JSON.stringify(sessions));
            window.renderSidebarSessions();
        }

        function switchSession(sId) {
            currentSessionId = sId;
            window.loadCurrentSession();
            window.renderSidebarSessions();
            sidebarDrawer.classList.remove('open');
            sidebarBackdrop.classList.remove('show');
        }

        menuToggleBtn.addEventListener('click', () => { window.renderSidebarSessions(); sidebarDrawer.classList.add('open'); sidebarBackdrop.classList.add('show'); });
        sidebarClose.addEventListener('click', () => { sidebarDrawer.classList.remove('open'); sidebarBackdrop.classList.remove('show'); });
        sidebarBackdrop.addEventListener('click', () => { sidebarDrawer.classList.remove('open'); sidebarBackdrop.classList.remove('show'); });

        sidebarNewChat.addEventListener('click', () => {
            currentSessionId = 'session_' + Date.now();
            window.messageHistory = [];
            selectedImages = [];
            previewContainer.innerHTML = '';
            chatStream.innerHTML = `<div class="msg-bubble ai">${getRandomWelcomeMessage()}</div>`;
            sidebarDrawer.classList.remove('open');
            sidebarBackdrop.classList.remove('show');
            window.renderSidebarSessions();
        });

        window.loadCurrentSession();
        window.renderSidebarSessions();

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block';
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') installBtn.style.display = 'none';
                deferredPrompt = null;
            }
        });

        attachBtn.addEventListener('click', () => imageInput.click());
        imageInput.addEventListener('change', (e) => {
            Array.from(e.target.files).forEach(file => {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    selectedImages.push({ mimeType: file.type || "image/jpeg", data: ev.target.result.split(',')[1] });
                    renderPreviews();
                };
                reader.readAsDataURL(file);
            });
            imageInput.value = '';
        });

        function renderPreviews() {
            previewContainer.innerHTML = '';
            selectedImages.forEach((img, idx) => {
                const wrap = document.createElement('div');
                wrap.className = 'preview-thumb-wrap';
                wrap.innerHTML = `<img src="data:${img.mimeType};base64,${img.data}"><button class="preview-remove" onclick="removeImage(${idx})">✕</button>`;
                previewContainer.appendChild(wrap);
            });
        }
        window.removeImage = (idx) => { selectedImages.splice(idx, 1); renderPreviews(); }

        async function handleSendMessage() {
            const text = userInput.value.trim();
            if (!text && selectedImages.length === 0) return;

            let imgs = [...selectedImages];
            appendUserMessage(text, imgs);
            userInput.value = ''; selectedImages = []; previewContainer.innerHTML = '';
            scrollToBottom();

            let parts = [];
            if (text) parts.push({ text });
            imgs.forEach(img => parts.push({ inlineData: { mimeType: img.mimeType, data: img.data } }));
            window.messageHistory.push({ role: "user", content: parts });
            if (text) saveMessageToStorage('user', text);

            if (!navigator.onLine) {
                const offlineMsg = "System offline 🔌. Check your connection!";
                appendHtmlMessage(offlineMsg, 'ai');
                window.messageHistory.push({ role: "model", content: offlineMsg });
                saveMessageToStorage('model', offlineMsg);
                scrollToBottom();
                return;
            }

            const loadingId = appendMessage("NOVA is cooking... 🍳", 'ai loading');
            scrollToBottom();

            try {
                let token = window.getCurrentAuthToken ? await window.getCurrentAuthToken() : null;
                const headers = { 'Content-Type': 'application/json' };
                if (token) headers['Authorization'] = `Bearer ${token}`;

                const now = new Date();
                const currentDateStr = now.toLocaleDateString('en-GB', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                const currentTimeStr = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });

                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({ 
                        messages: window.messageHistory,
                        roastLevel: mainRoastSlider.value || "2",
                        currentDate: currentDateStr,
                        currentTime: currentTimeStr
                    })
                });

                document.getElementById(loadingId)?.remove();
                const data = await res.json();

                if (data.reply) {
                    let formattedText = escapeHtml(data.reply)
                        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                        .replace(/\*(.*?)\*\*/g, '<em>$1</em>')
                        .replace(/\n/g, '<br>');

                    let finalReplyHtml = `<div>${formattedText}</div>`;

                    const lowerText = text.toLowerCase();
                    if (lowerText.includes('time') || lowerText.includes('date') || lowerText.includes('din') || lowerText.includes('aaj')) {
                        finalReplyHtml += `
                            <div class="neon-time-widget">
                                <div class="widget-left">
                                    <div class="widget-time-display">${currentTimeStr}</div>
                                    <div class="widget-date-display">${currentDateStr}</div>
                                    <div class="widget-timezone">Indian Standard Time (IST, UTC+5:30) 🇮🇳</div>
                                </div>
                                <div class="widget-clock-icon">⏰</div>
                            </div>
                        `;
                    }

                    appendHtmlMessage(finalReplyHtml, 'ai');
                    window.messageHistory.push({ role: "model", content: data.reply });
                    saveMessageToStorage('model', data.reply);
                } else if (data.error) {
                    appendMessage(`⚠️ Error: ${data.error}`, 'ai');
                } else {
                    appendMessage("⚠️ Kuch gadbad ho gayi!", 'ai');
                }
                scrollToBottom();
            } catch (err) {
                document.getElementById(loadingId)?.remove();
                appendMessage("⚠️ Server connection error!", 'ai');
                scrollToBottom();
            }
        }

        function appendUserMessage(text, images) {
            const div = document.createElement('div');
            div.className = 'msg-bubble user';
            let h = '';
            images.forEach(img => h += `<img src="data:${img.mimeType};base64,${img.data}" class="msg-image">`);
            if (text) h += `<div>${escapeHtml(text)}</div>`;
            div.innerHTML = h;
            chatStream.appendChild(div);
        }

        function appendMessage(txt, sender) {
            const div = document.createElement('div');
            const id = 'msg_' + Date.now();
            div.id = id; div.className = `msg-bubble ${sender}`; div.textContent = txt;
            chatStream.appendChild(div);
            return id;
        }

        function appendHtmlMessage(html, sender) {
            const div = document.createElement('div');
            div.className = `msg-bubble ${sender}`;
            div.innerHTML = html;
            chatStream.appendChild(div);
            return div;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function scrollToBottom() { chatStream.scrollTop = chatStream.scrollHeight; }

        sendBtn.addEventListener('click', handleSendMessage);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleSendMessage(); });
    </script>
</body>
</html>
