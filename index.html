<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NOVA AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #05010b;
            --neon-purple: #9d4edd;
            --neon-glow: #c77dff;
            --neon-cyan: #00ffcc;
            --glass-card: rgba(10, 3, 20, 0.25);
            --glass-border: rgba(199, 125, 255, 0.2);
            --text-main: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            letter-spacing: -0.01em;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100dvh;
            background: #000000;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(157, 78, 221, 0.15);
        }

        .mascot-wallpaper {
            position: absolute;
            inset: 0;
            background: url('file_00000000519482109897efcb371a5a26.png') no-repeat center center;
            background-size: cover;
            opacity: 0.8;
            z-index: 1;
            pointer-events: none;
            filter: contrast(1.25) brightness(0.95);
        }

        .overlay-gradient {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(5, 1, 11, 0.5) 0%, rgba(5, 1, 11, 0.1) 30%, rgba(5, 1, 11, 0.6) 85%, #05010b 100%);
            z-index: 2;
            pointer-events: none;
        }

        .top-bar {
            padding: 16px 20px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            border-bottom: 1px solid rgba(199, 125, 255, 0.1);
            background: rgba(5, 1, 11, 0.35);
            backdrop-filter: blur(12px);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-toggle-btn {
            background: rgba(40, 20, 65, 0.4);
            border: 1px solid var(--glass-border);
            color: #f1e6ff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 700;
            backdrop-filter: blur(8px);
        }

        .brand-col {
            display: flex;
            flex-direction: column;
        }

        .brand-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-name {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            color: #ffffff;
            text-shadow: 0 0 12px rgba(199, 125, 255, 0.8);
        }

        .pulse-dot {
            width: 7px;
            height: 7px;
            background-color: var(--neon-cyan);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--neon-cyan);
            animation: pulse 2s infinite;
        }

        .pulse-dot.offline {
            background-color: #ff3366 !important;
            box-shadow: 0 0 10px #ff3366 !important;
            animation: pulse-red 1.2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 12px var(--neon-cyan); }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        @keyframes pulse-red {
            0% { transform: scale(0.95); opacity: 0.7; }
            50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 14px #ff3366; }
            100% { transform: scale(0.95); opacity: 0.7; }
        }

        .status-tag {
            font-size: 0.7rem;
            color: var(--neon-glow);
            font-weight: 600;
            letter-spacing: 0.02em;
            margin-top: 2px;
        }

        .header-buttons {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .action-chip {
            background: rgba(40, 20, 65, 0.5);
            border: 1px solid var(--glass-border);
            color: #f1e6ff;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            backdrop-filter: blur(8px);
        }

        #installBtn {
            display: none;
            background: linear-gradient(135deg, #7b2cbf, #ff007f);
            color: #ffffff;
            border: none;
        }

        .user-pill {
            display: none;
            align-items: center;
            gap: 8px;
            background: rgba(40, 20, 65, 0.6);
            border: 1px solid var(--glass-border);
            padding: 4px 12px 4px 4px;
            border-radius: 20px;
            backdrop-filter: blur(8px);
        }

        .user-avatar {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            object-fit: cover;
        }

        .user-signout {
            background: transparent;
            border: none;
            color: #ff6b8b;
            font-size: 0.7rem;
            cursor: pointer;
            font-weight: 700;
        }

        .sidebar-drawer {
            position: absolute;
            top: 0;
            left: -100%;
            width: 80%;
            max-width: 320px;
            height: 100dvh;
            background: rgba(10, 3, 20, 0.95);
            backdrop-filter: blur(25px);
            border-right: 1px solid var(--glass-border);
            z-index: 100;
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.8);
        }

        .sidebar-drawer.open {
            left: 0;
        }

        .sidebar-header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(199, 125, 255, 0.15);
        }

        .sidebar-title {
            font-size: 1rem;
            font-weight: 700;
            color: #f1e6ff;
        }

        .sidebar-close {
            background: transparent;
            border: none;
            color: var(--neon-glow);
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
        }

        .sidebar-controls {
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-bottom: 1px solid rgba(199, 125, 255, 0.1);
        }

        .control-label {
            font-size: 0.75rem;
            color: var(--neon-glow);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .roast-slider-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .roast-slider-box input[type="range"] {
            flex: 1;
            accent-color: var(--neon-purple);
            cursor: pointer;
        }

        .roast-level-tag {
            font-size: 0.75rem;
            color: #ffffff;
            font-weight: 700;
            min-width: 65px;
            text-align: right;
        }

        .sidebar-new-chat-btn {
            margin: 12px 20px;
            background: linear-gradient(135deg, #7b2cbf, #9d4edd);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 15px rgba(157, 78, 221, 0.3);
        }

        .sidebar-history-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 16px 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .history-item {
            padding: 13px 15px;
            background: rgba(30, 12, 50, 0.5);
            border: 1px solid rgba(199, 125, 255, 0.15);
            border-radius: 12px;
            font-size: 0.86rem;
            font-weight: 600;
            color: #ffffff;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.2s;
        }

        .history-item.active {
            background: rgba(157, 78, 221, 0.35);
            border-color: var(--neon-glow);
        }

        .sidebar-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 90;
            display: none;
        }

        .sidebar-backdrop.show {
            display: block;
        }

        .chat-stream {
            flex: 1;
            overflow-y: auto;
            padding: 20px 18px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            z-index: 10;
            scroll-behavior: smooth;
        }

        .chat-stream::-webkit-scrollbar {
            display: none;
        }

        .msg-bubble {
            max-width: 88%;
            padding: 15px 18px;
            border-radius: 20px;
            font-size: 0.95rem;
            line-height: 1.6;
            font-weight: 600;
            backdrop-filter: blur(10px);
            word-wrap: break-word;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        .msg-bubble.ai {
            background: var(--glass-card);
            border: 1.5px solid rgba(199, 125, 255, 0.22);
            color: #ffffff;
            align-self: flex-start;
            border-top-left-radius: 6px;
        }

        .msg-bubble.user {
            background: rgba(123, 44, 191, 0.4);
            border: 1.5px solid rgba(224, 170, 255, 0.3);
            color: #ffffff;
            align-self: flex-end;
            border-top-right-radius: 6px;
        }

        .msg-image {
            max-width: 100%;
            border-radius: 12px;
            margin-bottom: 10px;
            display: block;
            border: 1px solid rgba(199, 125, 255, 0.4);
        }

        .preview-container {
            padding: 6px 18px 0;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            z-index: 10;
        }

        .preview-thumb-wrap {
            position: relative;
            width: 48px;
            height: 48px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--neon-glow);
            flex-shrink: 0;
        }

        .preview-thumb-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .preview-remove {
            position: absolute;
            top: 2px;
            right: 2px;
            background: rgba(0,0,0,0.75);
            color: white;
            border: none;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            font-size: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bottom-section {
            padding: 12px 18px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
            background: linear-gradient(to top, #05010b 80%, transparent);
        }

        .input-pill-box {
            background: rgba(15, 5, 25, 0.15);
            border: 1.5px solid rgba(199, 125, 255, 0.3);
            border-radius: 32px;
            padding: 6px 8px 6px 14px;
            display: flex;
            align-items: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 25px rgba(157, 78, 221, 0.15);
        }

        .text-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 600;
            outline: none;
            padding: 8px 4px;
        }

        .text-input::placeholder {
            color: rgba(224, 170, 255, 0.5);
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--neon-glow);
            font-size: 1.2rem;
            padding: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-send-btn {
            background: linear-gradient(135deg, #9d4edd, #c77dff);
            color: #ffffff;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(199, 125, 255, 0.6);
            margin-left: 6px;
            flex-shrink: 0;
        }

        .footer-branding {
            text-align: center;
            font-size: 0.72rem;
            color: rgba(224, 170, 255, 0.5);
            letter-spacing: 0.04em;
            font-weight: 600;
            margin-top: 2px;
        }

        .footer-branding a {
            color: var(--neon-glow);
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="mascot-wallpaper"></div>
        <div class="overlay-gradient"></div>

        <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
        <div class="sidebar-drawer" id="sidebarDrawer">
            <div class="sidebar-header">
                <span class="sidebar-title">✦ Settings & History</span>
                <button class="sidebar-close" id="sidebarClose">✕</button>
            </div>
            
            <div class="sidebar-controls">
                <span class="control-label">🔥 Savage Roast Level</span>
                <div class="roast-slider-box">
                    <input type="range" id="roastSlider" min="1" max="3" value="2">
                    <span class="roast-level-tag" id="roastLevelTag">Savage ⚡</span>
                </div>
            </div>

            <button class="sidebar-new-chat-btn" id="sidebarNewChat">+ New Chat Session</button>
            <div class="sidebar-history-list" id="sidebarHistoryList"></div>
        </div>

        <div class="top-bar">
            <div class="header-left">
                <button class="menu-toggle-btn" id="menuToggleBtn" title="Chat Settings & History">☰</button>
                <div class="brand-col">
                    <div class="brand-row">
                        <span class="brand-name">NOVA AI</span>
                        <div class="pulse-dot" id="statusDot"></div>
                    </div>
                    <span class="status-tag" id="statusText">System online ⚡</span>
                </div>
            </div>
            <div class="header-buttons">
                <button class="action-chip" id="installBtn">📲 Install</button>
                <button class="action-chip" id="googleSignInBtn" style="background: linear-gradient(135deg, #4285F4, #34A853); color: white; border: none;">Sign In</button>
                <div class="user-pill" id="userPill">
                    <img id="userAvatar" class="user-avatar" src="" alt="Avatar">
                    <button class="user-signout" id="googleSignOutBtn">Sign Out</button>
                </div>
            </div>
        </div>

        <div class="chat-stream" id="chatStream"></div>

        <div class="preview-container" id="previewContainer"></div>

        <div class="bottom-section">
            <div class="input-pill-box">
                <input type="file" id="imageInput" accept="image/*" multiple style="display: none;">
                <button class="icon-btn" id="attachBtn" title="Upload Images">📎</button>
                <input type="text" id="userInput" class="text-input" placeholder="Type prompt or command..." autocomplete="off">
                <button class="action-send-btn" id="sendBtn" title="Send">➔</button>
            </div>
            <div class="footer-branding">
                Powered by RaoSahab | Explore <a href="https://chaos-exe.vercel.app" target="_blank">CHAOS.EXE</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBFZgeMPYIdpTR92DUkVFz-7h1X2xOdH3A",
          authDomain: "nova-ai-57072.firebaseapp.com",
          projectId: "nova-ai-57072",
          storageBucket: "nova-ai-57072.firebasestorage.app",
          messagingSenderId: "672770051843",
          appId: "1:672770051843:web:ef21e65c3bc383d232a336",
          measurementId: "G-3VGYTZTB9E"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const googleSignInBtn = document.getElementById('googleSignInBtn');
        const googleSignOutBtn = document.getElementById('googleSignOutBtn');
        const userPill = document.getElementById('userPill');
        const userAvatar = document.getElementById('userAvatar');

        let currentUserToken = null;
        window.currentFirebaseUser = null;

        googleSignInBtn.addEventListener('click', async () => {
            try {
                const result = await signInWithPopup(auth, provider);
                currentUserToken = await result.user.getIdToken();
            } catch (error) {
                console.error("Auth Error:", error);
            }
        });

        googleSignOutBtn.addEventListener('click', async () => {
            await signOut(auth);
            currentUserToken = null;
            window.currentFirebaseUser = null;
            window.loadCurrentSession();
            window.renderSidebarSessions();
        });

        onAuthStateChanged(auth, async (user) => {
            window.currentFirebaseUser = user;
            if (user) {
                googleSignInBtn.style.display = 'none';
                userPill.style.display = 'flex';
                userAvatar.src = user.photoURL || '';
                currentUserToken = await user.getIdToken();
                if(user.displayName) {
                    localStorage.setItem('nova_user_name', user.displayName);
                }
            } else {
                googleSignInBtn.style.display = 'block';
                userPill.style.display = 'none';
                currentUserToken = null;
            }
            window.loadCurrentSession();
            window.renderSidebarSessions();
        });

        window.getCurrentAuthToken = async () => {
            if (auth.currentUser) return await auth.currentUser.getIdToken();
            return currentUserToken;
        };
    </script>

    <script>
        const chatStream = document.getElementById('chatStream');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const menuToggleBtn = document.getElementById('menuToggleBtn');
        const sidebarDrawer = document.getElementById('sidebarDrawer');
        const sidebarBackdrop = document.getElementById('sidebarBackdrop');
        const sidebarClose = document.getElementById('sidebarClose');
        const sidebarNewChat = document.getElementById('sidebarNewChat');
        const sidebarHistoryList = document.getElementById('sidebarHistoryList');
        const installBtn = document.getElementById('installBtn');
        const attachBtn = document.getElementById('attachBtn');
        const imageInput = document.getElementById('imageInput');
        const previewContainer = document.getElementById('previewContainer');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const roastSlider = document.getElementById('roastSlider');
        const roastLevelTag = document.getElementById('roastLevelTag');

        window.messageHistory = [];
        let selectedImages = [];
        let deferredPrompt;
        
        function getStorageKey() {
            const user = window.currentFirebaseUser;
            return user ? `nova_sessions_${user.uid}` : null;
        }

        let guestSessionStorage = {
            'session_guest': { title: 'Current Session', messages: [] }
        };
        let currentSessionId = 'session_' + Date.now();

        const welcomeMessagesPool = [
            "System online. NOVA active hai. Jyada bakchodi ki toh seedha roast khayega, baaki agar dhang ki baat karni hai toh bol, kya scene hai? ⚡",
            "System fully loaded! AI core online. Bataa aaj kya cook karna hai? 🚀",
            "NOVA operational. Focus high hai, excuses zero. Bata boss, kya task niptana hai? 🔥",
            "System connected. Standby mode off. Koi script, bug ya idea hai toh drop kar, abhi decode karte hain! ⚡",
            "NOVA AI online. Dimaag tez, tone savage! Kya chal raha hai, bata? 🎯"
        ];

        const offlineRepliesPool = [
            "Oye! Tera net band hai lagta hai. Offline mode active hai—pehle data on kar, tab tak bata main tera mirror image banke kya soch raha hoon? 🔌😎",
            "Connection lost! Network ne tera sath chhod diya. Offline mode me bhi tera digital twin ready hai. Data on kar fir aag lagate hain! ⚡",
            "System offline detected! Data connect kar warna main apne mirror-mode se tere saare secrets decode kar doonga. 🕶️"
        ];

        const roastLabels = { "1": "Mild 🌿", "2": "Savage ⚡", "3": "Nuclear 💥" };
        roastSlider.addEventListener('input', (e) => {
            roastLevelTag.textContent = roastLabels[e.target.value] || "Savage ⚡";
        });

        function getRandomWelcomeMessage() {
            return welcomeMessagesPool[Math.floor(Math.random() * welcomeMessagesPool.length)];
        }

        function getRandomOfflineReply() {
            return offlineRepliesPool[Math.floor(Math.random() * offlineRepliesPool.length)];
        }

        function updateNetworkStatus() {
            if (navigator.onLine) {
                statusDot.classList.remove('offline');
                statusText.textContent = "System online ⚡";
            } else {
                statusDot.classList.add('offline');
                statusText.textContent = "System offline 🔌";
            }
        }

        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);
        setInterval(updateNetworkStatus, 3000);
        updateNetworkStatus();

        window.renderSidebarSessions = function() {
            const storageKey = getStorageKey();
            sidebarHistoryList.innerHTML = '';
            
            if (!storageKey) {
                sidebarHistoryList.innerHTML = '<div style="color: rgba(224,170,255,0.6); font-size: 0.8rem; text-align: center; margin-top: 25px; font-weight: 600; line-height: 1.5;">🔒 Guest Mode Active<br><span style="font-size:0.7rem; opacity:0.7;">Sign in karke history save karein!</span></div>';
                return;
            }

            let sessions = JSON.parse(localStorage.getItem(storageKey) || '{}');
            const sessionKeys = Object.keys(sessions);
            
            if (sessionKeys.length === 0) {
                sidebarHistoryList.innerHTML = '<div style="color: rgba(224,170,255,0.5); font-size: 0.8rem; text-align: center; margin-top: 20px; font-weight: 600;">Koi history nahi hai abhi.</div>';
                return;
            }

            sessionKeys.sort().reverse().forEach(sId => {
                const sess = sessions[sId];
                const item = document.createElement('div');
                item.className = `history-item ${sId === currentSessionId ? 'active' : ''}`;
                item.textContent = sess.title || 'Nova Chat Session';
                item.onclick = () => switchSession(sId);
                sidebarHistoryList.appendChild(item);
            });
        }

        window.loadCurrentSession = function() {
            const storageKey = getStorageKey();
            chatStream.innerHTML = '';
            window.messageHistory = [];

            let sessions = {};
            if (storageKey) {
                sessions = JSON.parse(localStorage.getItem(storageKey) || '{}');
                if (Object.keys(sessions).length > 0 && !sessions[currentSessionId]) {
                    currentSessionId = Object.keys(sessions).sort().reverse()[0];
                }
            } else {
                sessions = guestSessionStorage;
                currentSessionId = 'session_guest';
            }

            if (sessions[currentSessionId] && sessions[currentSessionId].messages && sessions[currentSessionId].messages.length > 0) {
                sessions[currentSessionId].messages.forEach(msg => {
                    if (msg.role === 'user') {
                        appendUserMessage(msg.text, []);
                        window.messageHistory.push({ role: "user", content: [{ text: msg.text }] });
                    } else if (msg.role === 'model') {
                        appendHtmlMessage(msg.text, 'ai');
                        window.messageHistory.push({ role: "model", content: [{ text: msg.text }] });
                    }
                });
            } else {
                const welcomeMsg = getRandomWelcomeMessage();
                appendHtmlMessage(welcomeMsg, 'ai');
            }
            chatStream.scrollTop = chatStream.scrollHeight;
        }

        function saveMessageToStorage(role, text) {
            const storageKey = getStorageKey();
            if (!storageKey) {
                if (!guestSessionStorage[currentSessionId]) {
                    guestSessionStorage[currentSessionId] = { title: text.substring(0, 30), messages: [] };
                }
                guestSessionStorage[currentSessionId].messages.push({ role, text });
                return;
            }

            let sessions = JSON.parse(localStorage.getItem(storageKey) || '{}');
            if (!sessions[currentSessionId]) {
                sessions[currentSessionId] = {
                    title: text.length > 30 ? text.substring(0, 30) + '...' : text,
                    messages: []
                };
            }
            sessions[currentSessionId].messages.push({ role, text });
            localStorage.setItem(storageKey, JSON.stringify(sessions));
            window.renderSidebarSessions();
        }

        function switchSession(sId) {
            currentSessionId = sId;
            window.loadCurrentSession();
            window.renderSidebarSessions();
            sidebarDrawer.classList.remove('open');
            sidebarBackdrop.classList.remove('show');
        }

        menuToggleBtn.addEventListener('click', () => {
            window.renderSidebarSessions();
            sidebarDrawer.classList.add('open');
            sidebarBackdrop.classList.add('show');
        });

        sidebarClose.addEventListener('click', () => {
            sidebarDrawer.classList.remove('open');
            sidebarBackdrop.classList.remove('show');
        });

        sidebarBackdrop.addEventListener('click', () => {
            sidebarDrawer.classList.remove('open');
            sidebarBackdrop.classList.remove('show');
        });

        sidebarNewChat.addEventListener('click', () => {
            currentSessionId = 'session_' + Date.now();
            window.messageHistory = [];
            selectedImages = [];
            previewContainer.innerHTML = '';
            
            const welcomeMsg = getRandomWelcomeMessage();
            chatStream.innerHTML = `<div class="msg-bubble ai">${welcomeMsg}</div>`;
            
            sidebarDrawer.classList.remove('open');
            sidebarBackdrop.classList.remove('show');
            window.renderSidebarSessions();
        });

        window.loadCurrentSession();
        window.renderSidebarSessions();

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block';
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') installBtn.style.display = 'none';
                deferredPrompt = null;
            }
        });

        attachBtn.addEventListener('click', () => imageInput.click());

        imageInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            if (!files.length) return;

            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (uploadEvent) => {
                    const base64String = uploadEvent.target.result;
                    selectedImages.push({
                        mimeType: file.type || "image/jpeg",
                        data: base64String.split(',')[1]
                    });
                    renderPreviews();
                };
                reader.readAsDataURL(file);
            });
            imageInput.value = '';
        });

        function renderPreviews() {
            previewContainer.innerHTML = '';
            selectedImages.forEach((imgObj, index) => {
                const wrap = document.createElement('div');
                wrap.className = 'preview-thumb-wrap';
                wrap.innerHTML = `
                    <img src="data:${imgObj.mimeType};base64,${imgObj.data}" alt="preview">
                    <button class="preview-remove" onclick="removeImage(${index})">✕</button>
                `;
                previewContainer.appendChild(wrap);
            });
        }

        window.removeImage = function(index) {
            selectedImages.splice(index, 1);
            renderPreviews();
        }

        async function handleSendMessage() {
            const text = userInput.value.trim();
            if (!text && selectedImages.length === 0) return;

            let currentImagesSnapshot = [...selectedImages];
            appendUserMessage(text, currentImagesSnapshot);
            
            userInput.value = '';
            selectedImages = [];
            previewContainer.innerHTML = '';
            scrollToBottom();

            let userContentParts = [];
            if (text) userContentParts.push({ text: text });
            currentImagesSnapshot.forEach(img => {
                userContentParts.push({
                    inlineData: { mimeType: img.mimeType, data: img.data }
                });
            });

            window.messageHistory.push({ role: "user", content: userContentParts });
            if (text) saveMessageToStorage('user', text);

            if (!navigator.onLine) {
                const offlineMsg = getRandomOfflineReply();
                appendHtmlMessage(offlineMsg, 'ai');
                window.messageHistory.push({ role: "model", content: offlineMsg });
                saveMessageToStorage('model', offlineMsg);
                scrollToBottom();
                return;
            }

            const aiMsgId = appendMessage("", 'ai');
            const aiMsgElem = document.getElementById(aiMsgId);
            scrollToBottom();

            try {
                let token = null;
                if (window.getCurrentAuthToken) token = await window.getCurrentAuthToken();

                const headers = { 'Content-Type': 'application/json' };
                if (token) headers['Authorization'] = `Bearer ${token}`;

                const currentRoastLevel = roastSlider.value || "2";
                const now = new Date();
                const currentDateStr = now.toLocaleDateString('en-GB', {
                    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
                });

                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({ 
                        messages: window.messageHistory,
                        roastLevel: currentRoastLevel,
                        currentDate: currentDateStr
                    })
                });

                if (response.status === 403) {
                    aiMsgElem.textContent = "⚠️ Firewall Blocked: Access restricted.";
                    scrollToBottom();
                    return;
                }

                if (!response.ok) {
                    aiMsgElem.textContent = "⚠️ Server connection failed.";
                    scrollToBottom();
                    return;
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullReplyText = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value, { stream: true });
                    
                    const lines = chunk.split('\n');
                    for (const line of lines) {
                        if (line.startsWith('data:')) {
                            const jsonStr = line.replace('data:', '').trim();
                            if (jsonStr === '[DONE]') continue;
                            try {
                                const parsed = JSON.parse(jsonStr);
                                const textChunk = parsed.candidates?.[0]?.content?.parts?.[0]?.text || "";
                                fullReplyText += textChunk;
                                aiMsgElem.textContent = fullReplyText;
                                scrollToBottom();
                            } catch (e) {}
                        }
                    }
                }

                if (fullReplyText) {
                    window.messageHistory.push({ role: "model", content: fullReplyText });
                    saveMessageToStorage('model', fullReplyText);
                }

            } catch (error) {
                console.error(error);
                aiMsgElem.textContent = "⚠️ Connection error occurred.";
                scrollToBottom();
            }
        }

        function appendUserMessage(text, images) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'msg-bubble user';
            let htmlContent = '';
            if (images && images.length > 0) {
                images.forEach(img => {
                    htmlContent += `<img src="data:${img.mimeType};base64,${img.data}" class="msg-image">`;
                });
            }
            if (text) htmlContent += `<div>${escapeHtml(text)}</div>`;
            msgDiv.innerHTML = htmlContent;
            chatStream.appendChild(msgDiv);
        }

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            const msgId = 'msg_' + Date.now() + Math.random().toString(36).substr(2, 4);
            msgDiv.id = msgId;
            msgDiv.className = `msg-bubble ${sender}`;
            msgDiv.textContent = text;
            chatStream.appendChild(msgDiv);
            return msgId;
        }

        function appendHtmlMessage(html, sender) {
            const msgDiv = document.createElement('div');
            const msgId = 'msg_' + Date.now() + Math.random().toString(36).substr(2, 4);
            msgDiv.id = msgId;
            msgDiv.className = `msg-bubble ${sender}`;
            msgDiv.innerHTML = html;
            chatStream.appendChild(msgDiv);
            return msgId;
        }

        function escapeHtml(string) {
            return string.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function scrollToBottom() {
            chatStream.scrollTop = chatStream.scrollHeight;
        }

        sendBtn.addEventListener('click', handleSendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSendMessage();
        });
    </script>
</body>
</html>
