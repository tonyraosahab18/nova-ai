<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NOVA AI | Powered by RaoSahab</title>
    <style>
        :root {
            --bg-dark: #05010b;
            --neon-purple: #9d4edd;
            --neon-glow: #c77dff;
            --glass-card: rgba(10, 3, 20, 0.25);
            --glass-border: rgba(199, 125, 255, 0.15);
            --text-main: #f8f9fa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100dvh;
            background: #000000;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(157, 78, 221, 0.15);
        }

        /* Fullscreen Mascot Background Wall */
        .mascot-wallpaper {
            position: absolute;
            inset: 0;
            background: url('file_00000000519482109897efcb371a5a26.png') no-repeat center center;
            background-size: cover;
            opacity: 0.72;
            z-index: 1;
            pointer-events: none;
            filter: contrast(1.18) brightness(0.92);
        }

        .overlay-gradient {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(5, 1, 11, 0.6) 0%, rgba(5, 1, 11, 0.12) 35%, rgba(5, 1, 11, 0.75) 85%, #05010b 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* Header */
        .top-bar {
            padding: 16px 20px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            border-bottom: 1px solid rgba(199, 125, 255, 0.08);
            background: rgba(5, 1, 11, 0.4);
            backdrop-filter: blur(10px);
        }

        .header-left {
            display: flex;
            flex-direction: column;
        }

        .brand-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-name {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 0 12px rgba(199, 125, 255, 0.8);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #00ffcc;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ffcc;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 12px #00ffcc; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .status-tag {
            font-size: 0.65rem;
            color: var(--neon-glow);
            opacity: 0.85;
            font-weight: 500;
            letter-spacing: 0.5px;
            margin-top: 1px;
        }

        .header-buttons {
            display: flex;
            gap: 6px;
        }

        .action-chip {
            background: rgba(30, 15, 50, 0.5);
            border: 1px solid var(--glass-border);
            color: #e0aaff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.2s ease;
        }

        .action-chip:active {
            transform: scale(0.95);
            background: rgba(157, 78, 221, 0.3);
        }

        #installBtn {
            display: none;
            background: linear-gradient(135deg, #7b2cbf, #ff007f);
            color: #ffffff;
            border: none;
        }

        /* Chat Stream */
        .chat-stream {
            flex: 1;
            overflow-y: auto;
            padding: 15px 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            z-index: 10;
            scroll-behavior: smooth;
        }

        .chat-stream::-webkit-scrollbar {
            display: none;
        }

        .msg-bubble {
            max-width: 85%;
            padding: 13px 17px;
            border-radius: 18px;
            font-size: 0.9rem;
            line-height: 1.5;
            backdrop-filter: blur(6px);
            word-wrap: break-word;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .msg-bubble.ai {
            background: var(--glass-card);
            border: 1px solid var(--glass-border);
            color: #f1e6ff;
            align-self: flex-start;
            border-top-left-radius: 4px;
        }

        .msg-bubble.ai a {
            color: #ff4d6d;
            font-weight: bold;
            text-decoration: underline;
        }

        .msg-bubble.user {
            background: rgba(123, 44, 191, 0.35);
            border: 1px solid rgba(224, 170, 255, 0.2);
            color: #ffffff;
            align-self: flex-end;
            border-top-right-radius: 4px;
        }

        .msg-image {
            max-width: 100%;
            border-radius: 12px;
            margin-bottom: 8px;
            display: block;
            border: 1px solid rgba(199, 125, 255, 0.3);
        }

        /* Watermarked Image Container with Download Option */
        .watermarked-img-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 6px;
            border: 1px solid rgba(199, 125, 255, 0.4);
            box-shadow: 0 0 15px rgba(157, 78, 221, 0.3);
        }

        .watermarked-img-wrapper img {
            width: 100%;
            display: block;
        }

        /* Minimalist Glowing Star Watermark Badge */
        .nova-watermark-badge {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(10, 3, 20, 0.75);
            border: 1px solid rgba(199, 125, 255, 0.6);
            padding: 5px 7px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(6px);
            box-shadow: 0 0 12px rgba(199, 125, 255, 0.7);
            pointer-events: none;
        }

        .nova-star-icon {
            color: #c77dff;
            font-size: 0.95rem;
            text-shadow: 0 0 8px #c77dff, 0 0 15px #9d4edd;
            line-height: 1;
        }

        .download-img-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            background: rgba(157, 78, 221, 0.2);
            border: 1px solid rgba(199, 125, 255, 0.4);
            color: #e0aaff;
            padding: 6px 12px;
            border-radius: 14px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            backdrop-filter: blur(6px);
            transition: background 0.2s;
        }

        .download-img-btn:active {
            background: rgba(157, 78, 221, 0.4);
        }

        /* Preview container for selected images */
        .preview-container {
            padding: 5px 18px 0;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            z-index: 10;
        }

        .preview-thumb-wrap {
            position: relative;
            width: 45px;
            height: 45px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--neon-glow);
            flex-shrink: 0;
        }

        .preview-thumb-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .preview-remove {
            position: absolute;
            top: 2px;
            right: 2px;
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            border-radius: 50%;
            width: 15px;
            height: 15px;
            font-size: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Bottom Control Bar */
        .bottom-section {
            padding: 10px 18px 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 10;
            background: linear-gradient(to top, #05010b 85%, transparent);
        }

        .input-pill-box {
            background: rgba(15, 5, 25, 0.5);
            border: 1.5px solid rgba(199, 125, 255, 0.25);
            border-radius: 30px;
            padding: 6px 8px 6px 14px;
            display: flex;
            align-items: center;
            backdrop-filter: blur(14px);
            box-shadow: 0 0 20px rgba(157, 78, 221, 0.15);
        }

        .text-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 0.92rem;
            outline: none;
            padding: 8px 4px;
        }

        .text-input::placeholder {
            color: rgba(224, 170, 255, 0.4);
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: #c77dff;
            font-size: 1.15rem;
            padding: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .icon-btn:active {
            transform: scale(0.9);
        }

        .action-send-btn {
            background: linear-gradient(135deg, #9d4edd, #c77dff);
            color: #ffffff;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 12px rgba(199, 125, 255, 0.4);
            transition: transform 0.15s ease;
            margin-left: 4px;
            flex-shrink: 0;
        }

        .action-send-btn:active {
            transform: scale(0.9);
        }

        .footer-branding {
            text-align: center;
            font-size: 0.65rem;
            color: rgba(224, 170, 255, 0.4);
            letter-spacing: 0.8px;
            font-weight: 500;
            margin-top: 2px;
        }

        .footer-branding a {
            color: #c77dff;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="mascot-wallpaper"></div>
        <div class="overlay-gradient"></div>

        <div class="top-bar">
            <div class="header-left">
                <div class="brand-row">
                    <span class="brand-name">NOVA AI</span>
                    <div class="pulse-dot"></div>
                </div>
                <span class="status-tag">System Online. Ready for Chaos. ⚡</span>
            </div>
            <div class="header-buttons">
                <button class="action-chip" id="installBtn">📲 Install</button>
                <button class="action-chip" id="clearBtn">+ New Chat</button>
            </div>
        </div>

        <div class="chat-stream" id="chatStream">
            <div class="msg-bubble ai">
                System online. RaoSahab ki NOVA active hai. Bol kya scene hai? ⚡
            </div>
        </div>

        <!-- Image Previews Container -->
        <div class="preview-container" id="previewContainer"></div>

        <div class="bottom-section">
            <div class="input-pill-box">
                <input type="file" id="imageInput" accept="image/*" multiple style="display: none;">
                <button class="icon-btn" id="attachBtn" title="Upload Images">📎</button>
                <button class="icon-btn" id="micBtn" title="Voice Input">🎙️</button>
                <input type="text" id="userInput" class="text-input" placeholder="Type prompt or command..." autocomplete="off">
                <button class="action-send-btn" id="sendBtn" title="Send">➔</button>
            </div>
            <div class="footer-branding">
                Powered by RaoSahab | Explore <a href="https://chaos-exe.vercel.app" target="_blank">CHAOS.EXE</a>
            </div>
        </div>
    </div>

    <script>
        const chatStream = document.getElementById('chatStream');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const clearBtn = document.getElementById('clearBtn');
        const installBtn = document.getElementById('installBtn');
        const attachBtn = document.getElementById('attachBtn');
        const imageInput = document.getElementById('imageInput');
        const previewContainer = document.getElementById('previewContainer');
        const micBtn = document.getElementById('micBtn');

        let messageHistory = [];
        let selectedImages = [];
        let deferredPrompt;

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block';
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') installBtn.style.display = 'none';
                deferredPrompt = null;
            }
        });

        attachBtn.addEventListener('click', () => imageInput.click());

        imageInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            if (!files.length) return;

            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (uploadEvent) => {
                    const base64String = uploadEvent.target.result;
                    selectedImages.push({
                        mimeType: file.type || "image/jpeg",
                        data: base64String.split(',')[1]
                    });
                    renderPreviews();
                };
                reader.readAsDataURL(file);
            });
            imageInput.value = '';
        });

        function renderPreviews() {
            previewContainer.innerHTML = '';
            selectedImages.forEach((imgObj, index) => {
                const wrap = document.createElement('div');
                wrap.className = 'preview-thumb-wrap';
                wrap.innerHTML = `
                    <img src="data:${imgObj.mimeType};base64,${imgObj.data}" alt="preview">
                    <button class="preview-remove" onclick="removeImage(${index})">✕</button>
                `;
                previewContainer.appendChild(wrap);
            });
        }

        window.removeImage = function(index) {
            selectedImages.splice(index, 1);
            renderPreviews();
        }

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'hi-IN';
            recognition.continuous = false;
            recognition.interimResults = false;

            micBtn.addEventListener('click', () => {
                recognition.start();
                userInput.placeholder = "Listening...";
            });

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                userInput.value = userInput.value ? userInput.value + ' ' + transcript : transcript;
                userInput.placeholder = "Type prompt or command...";
            };

            recognition.onerror = () => { userInput.placeholder = "Type prompt or command..."; };
            recognition.onend = () => { userInput.placeholder = "Type prompt or command..."; };
        } else {
            micBtn.style.display = 'none';
        }

        async function handleSendMessage() {
            const text = userInput.value.trim();
            if (!text && selectedImages.length === 0) return;

            let currentImagesSnapshot = [...selectedImages];
            appendUserMessage(text, currentImagesSnapshot);
            
            userInput.value = '';
            selectedImages = [];
            previewContainer.innerHTML = '';
            scrollToBottom();

            const lowerText = text.toLowerCase();
            const isImageGenRequest = (lowerText.includes("generate") || lowerText.includes("bana do") || lowerText.includes("create") || lowerText.includes("draw") || lowerText.includes("image bana")) && currentImagesSnapshot.length === 0;

            if (isImageGenRequest) {
                const loadingId = appendMessage("NOVA is generating image...", 'ai loading');
                scrollToBottom();

                const promptQuery = encodeURIComponent(text);
                // n=true hides pollinations branding watermark on their side
                const imageUrl = `https://image.pollinations.ai/prompt/${promptQuery}?width=1024&height=1024&nologo=true`;

                // Fetch blob to enable direct clean download feature
                try {
                    const imgBlobRes = await fetch(imageUrl);
                    const blob = await imgBlobRes.blob();
                    const localBlobUrl = URL.createObjectURL(blob);

                    const loadingElem = document.getElementById(loadingId);
                    if (loadingElem) loadingElem.remove();

                    const replyHtml = `
                        Le bhai, teri demand par image ready kar di hai! 🎨
                        <div class="watermarked-img-wrapper">
                            <img src="${localBlobUrl}" alt="Generated Image" id="genImg_${Date.now()}">
                            <div class="nova-watermark-badge">
                                <span class="nova-star-icon">✦</span>
                            </div>
                        </div>
                        <a href="${localBlobUrl}" download="nova-rao-sahab-${Date.now()}.jpg" class="download-img-btn">
                            📥 Download Image
                        </a>
                    `;
                    appendHtmlMessage(replyHtml, 'ai');
                    scrollToBottom();
                } catch (e) {
                    const loadingElem = document.getElementById(loadingId);
                    if (loadingElem) loadingElem.remove();

                    const replyHtml = `
                        Le bhai, teri demand par image generate kar di hai! 🎨
                        <div class="watermarked-img-wrapper">
                            <img src="${imageUrl}" alt="Generated Image">
                            <div class="nova-watermark-badge">
                                <span class="nova-star-icon">✦</span>
                            </div>
                        </div>
                        <a href="${imageUrl}" target="_blank" download class="download-img-btn">
                            📥 Download Image
                        </a>
                    `;
                    appendHtmlMessage(replyHtml, 'ai');
                    scrollToBottom();
                }
                return;
            }

            // Standard Multimodal Chat Flow
            let userContentParts = [];
            if (text) userContentParts.push({ text: text });
            currentImagesSnapshot.forEach(img => {
                userContentParts.push({
                    inlineData: { mimeType: img.mimeType, data: img.data }
                });
            });

            messageHistory.push({ role: "user", content: userContentParts });

            const loadingId = appendMessage("NOVA is cooking...", 'ai loading');
            scrollToBottom();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: messageHistory })
                });

                const data = await response.json();
                const loadingElem = document.getElementById(loadingId);
                if (loadingElem) loadingElem.remove();

                if (data.reply) {
                    appendHtmlMessage(data.reply, 'ai');
                    messageHistory.push({ role: "model", content: data.reply });
                } else if (data.error) {
                    appendMessage(`⚠️ Error: ${data.error}`, 'ai');
                } else {
                    appendMessage("Kuch gadbad ho gayi bhai!", 'ai');
                }

                scrollToBottom();

            } catch (error) {
                const loadingElem = document.getElementById(loadingId);
                if (loadingElem) loadingElem.remove();
                appendMessage("Server ke sath connection toot gaya!", 'ai');
                scrollToBottom();
            }
        }

        function appendUserMessage(text, images) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'msg-bubble user';
            
            let htmlContent = '';
            images.forEach(img => {
                htmlContent += `<img src="data:${img.mimeType};base64,${img.data}" class="msg-image">`;
            });
            if (text) {
                htmlContent += `<div>${escapeHtml(text)}</div>`;
            }
            msgDiv.innerHTML = htmlContent;
            chatStream.appendChild(msgDiv);
        }

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            const msgId = 'msg_' + Date.now() + Math.random().toString(36).substr(2, 4);
            msgDiv.id = msgId;
            msgDiv.className = `msg-bubble ${sender}`;
            msgDiv.textContent = text;
            chatStream.appendChild(msgDiv);
            return msgId;
        }

        function appendHtmlMessage(html, sender) {
            const msgDiv = document.createElement('div');
            const msgId = 'msg_' + Date.now() + Math.random().toString(36).substr(2, 4);
            msgDiv.id = msgId;
            msgDiv.className = `msg-bubble ${sender}`;
            msgDiv.innerHTML = html;
            chatStream.appendChild(msgDiv);
            return msgId;
        }

        function escapeHtml(string) {
            return string.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function scrollToBottom() {
            chatStream.scrollTop = chatStream.scrollHeight;
        }

        sendBtn.addEventListener('click', handleSendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSendMessage();
        });

        clearBtn.addEventListener('click', () => {
            messageHistory = [];
            selectedImages = [];
            previewContainer.innerHTML = '';
            chatStream.innerHTML = `
                <div class="msg-bubble ai">
                    Session wiped. RaoSahab ki NOVA wapas online hai. Bol kya scene hai? ⚡
                </div>
            `;
        });
    </script>
</body>
</html>
