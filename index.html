<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA AI ✦ Chaos.exe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f19',
                        panelBg: '#131826',
                        accent: '#6366f1'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-darkBg text-gray-100 font-sans h-screen flex flex-col justify-between overflow-hidden">

    <!-- Top Navigation Bar -->
    <header class="flex justify-between items-center px-6 py-3 border-b border-gray-800 bg-panelBg/80 backdrop-blur-md">
        <div class="flex items-center space-x-2">
            <span class="text-accent text-lg animate-pulse">✦</span>
            <div>
                <h1 class="text-sm font-bold tracking-wide">NOVA AI <span class="w-2 h-2 inline-block bg-green-500 rounded-full ml-1"></span></h1>
                <p class="text-[10px] text-gray-400">System Online. Ready for Chaos. ⚡</p>
            </div>
        </div>
        
        <div class="flex items-center space-x-3">
            <button onclick="startNewChat()" class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1.5 rounded-lg transition border border-gray-700">+ New Chat</button>
            <div id="userInfo" class="hidden flex items-center space-x-2">
                <img id="userAvatar" src="" alt="User" class="w-7 h-7 rounded-full border border-gray-700">
                <button onclick="handleSignOut()" class="text-[10px] bg-red-500/10 text-red-400 hover:bg-red-500/20 px-2 py-1 rounded">Sign Out</button>
            </div>
            <button id="signInBtn" onclick="handleGoogleSignIn()" class="flex items-center space-x-1.5 bg-white text-gray-900 px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-gray-100 transition shadow-sm">
                <i class="fab fa-google"></i>
                <span>Sign In</span>
            </button>
        </div>
    </header>

    <!-- Chat Message Container -->
    <main id="chatContainer" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4 max-w-4xl w-full mx-auto">
        <!-- Initial Greeting Bubble -->
        <div class="flex items-start space-x-3">
            <div class="w-8 h-8 rounded-full bg-accent/20 border border-accent/40 flex items-center justify-center text-accent text-xs">✦</div>
            <div class="bg-panelBg border border-gray-800 p-4 rounded-2xl max-w-xl text-sm leading-relaxed shadow-lg">
                Ready hai tere liye. Batao, aaj kya tod-phod karni hai ya koi naya image bhej ke roast karwana hai? 😎
            </div>
        </div>
    </main>

    <!-- Bottom Input Bar -->
    <footer class="p-4 bg-darkBg border-t border-gray-800/60">
        <div class="max-w-3xl mx-auto">
            <div class="relative bg-panelBg border border-gray-800 rounded-2xl p-2 shadow-inner flex items-center">
                <button class="text-gray-400 hover:text-gray-200 px-3 py-2 text-sm"><i class="fas fa-paperclip"></i></button>
                <button class="text-gray-400 hover:text-gray-200 px-2 py-2 text-sm"><i class="fas fa-microphone"></i></button>
                <textarea id="promptInput" rows="1" placeholder="Type prompt or command..." class="w-full bg-transparent text-gray-100 placeholder-gray-500 text-sm px-2 py-2 focus:outline-none resize-none max-h-32"></textarea>
                <button onclick="handleUserSubmit()" id="generateBtn" class="bg-accent hover:bg-accent/90 text-white p-2.5 rounded-xl text-sm transition flex items-center justify-center ml-2 shadow-md">
                    <i class="fas fa-arrow-up"></i>
                </button>
            </div>
            <div class="text-center mt-2 text-[10px] text-gray-500">
                Powered by RaoSahab | Explore CHAOS.EXE
            </div>
        </div>
    </footer>

    <!-- Firebase & Chat Logic Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBFZgeMPYIdpTR92DUkVFz-7h1X2xOdH3A",
          authDomain: "nova-ai-57072.firebaseapp.com",
          projectId: "nova-ai-57072",
          storageBucket: "nova-ai-57072.firebasestorage.app",
          messagingSenderId: "672770051843",
          appId: "1:672770051843:web:ef21e65c3bc383d232a336",
          measurementId: "G-3VGYTZTB9E"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        window.handleGoogleSignIn = async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error("Login Error:", error);
                alert("Google Sign-In failed. Make sure your Vercel domain is added in Firebase Console > Authentication > Authorized domains.");
            }
        };

        window.handleSignOut = async () => {
            await signOut(auth);
        };

        onAuthStateChanged(auth, (user) => {
            const signInBtn = document.getElementById('signInBtn');
            const userInfo = document.getElementById('userInfo');
            if (user) {
                signInBtn.classList.add('hidden');
                userInfo.classList.remove('hidden');
                document.getElementById('userAvatar').src = user.photoURL;
            } else {
                signInBtn.classList.remove('hidden');
                userInfo.classList.add('hidden');
            }
        });

        window.startNewChat = () => {
            const chatContainer = document.getElementById('chatContainer');
            chatContainer.innerHTML = `
                <div class="flex items-start space-x-3">
                    <div class="w-8 h-8 rounded-full bg-accent/20 border border-accent/40 flex items-center justify-center text-accent text-xs">✦</div>
                    <div class="bg-panelBg border border-gray-800 p-4 rounded-2xl max-w-xl text-sm leading-relaxed shadow-lg">
                        Naya chat shuru ho gaya hai. Batao kya karna hai? ⚡
                    </div>
                </div>
            `;
        }

        window.handleUserSubmit = async () => {
            const input = document.getElementById('promptInput');
            const prompt = input.value.trim();
            if (!prompt) return;

            const chatContainer = document.getElementById('chatContainer');

            // Append User Message
            const userMsgDiv = document.createElement('div');
            userMsgDiv.className = "flex justify-end";
            userMsgDiv.innerHTML = `
                <div class="bg-accent text-white p-3.5 rounded-2xl max-w-xl text-sm shadow-md">
                    ${prompt}
                </div>
            `;
            chatContainer.appendChild(userMsgDiv);
            input.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Append Loading / AI Response Bubble
            const aiMsgId = 'ai-msg-' + Date.now();
            const aiMsgDiv = document.createElement('div');
            aiMsgDiv.className = "flex items-start space-x-3";
            aiMsgDiv.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-accent/20 border border-accent/40 flex items-center justify-center text-accent text-xs">✦</div>
                <div id="${aiMsgId}" class="bg-panelBg border border-gray-800 p-4 rounded-2xl max-w-xl text-sm leading-relaxed shadow-lg space-y-3">
                    <div class="flex items-center space-x-2 text-gray-400">
                        <div class="w-4 h-4 border-2 border-accent border-t-transparent rounded-full animate-spin"></div>
                        <span>Crafting high-quality image...</span>
                    </div>
                </div>
            `;
            chatContainer.appendChild(aiMsgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Generate Image URL (Using reliable fast endpoint to avoid browser CORS issues)
            const encodedPrompt = encodeURIComponent(prompt);
            const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?nologo=true&private=true&enhance=true`;

            // Preload image to ensure it's ready
            const img = new Image();
            img.src = imageUrl;
            img.onload = () => {
                const bubble = document.getElementById(aiMsgId);
                bubble.innerHTML = `
                    <p class="text-gray-200">Le bhai, teri demand par image ready kar di hai! 🎨</p>
                    <div class="relative group rounded-xl overflow-hidden border border-gray-800">
                        <img src="${imageUrl}" class="w-full h-auto object-cover">
                        <div class="absolute bottom-3 right-3 opacity-0 group-hover:opacity-100 transition bg-black/70 backdrop-blur px-3 py-1.5 rounded-lg">
                            <a href="${imageUrl}" download="nova-ai.jpg" target="_blank" class="text-xs text-white flex items-center space-x-1">
                                <i class="fas fa-download"></i>
                                <span>Download</span>
                            </a>
                        </div>
                    </div>
                `;
                chatContainer.scrollTop = chatContainer.scrollHeight;
            };

            img.onerror = () => {
                const bubble = document.getElementById(aiMsgId);
                bubble.innerHTML = `<span class="text-red-400">Image generation failed. Please try again.</span>`;
            };
        };
    </script>
</body>
</html>
