<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NOVA AI | Futuristic Gen-Z Companion</title>
    <style>
        :root {
            --bg-color: #030008;
            --primary-purple: #9d4edd;
            --neon-glow: #e0aaff;
            --neon-pink: #ff007f;
            --glass-bg: rgba(18, 10, 35, 0.75);
            --border-glass: rgba(199, 125, 255, 0.25);
            --text-main: #f8f9fa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-image: radial-gradient(circle at 50% 30%, rgba(157, 78, 221, 0.25) 0%, transparent 80%);
        }

        .container {
            width: 100%;
            max-width: 480px;
            height: 100dvh;
            background: #05000c;
            border: 2px solid #240046;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(157, 78, 221, 0.4);
        }

        /* Fixed Background Mascot Watermark */
        .mascot-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('file_00000000519482109897efcb371a5a26.png') no-repeat center center;
            background-size: cover;
            opacity: 0.15;
            z-index: 1;
            pointer-events: none;
            filter: drop-shadow(0 0 30px var(--primary-purple));
        }

        .top-header {
            padding: 12px 20px;
            background: rgba(10, 2, 20, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        .brand-title {
            font-size: 1.2rem;
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(45deg, #c77dff, #ff007f, #9d4edd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(199, 125, 255, 0.5);
        }

        .tagline {
            font-size: 0.7rem;
            color: #e0aaff;
            margin-top: 2px;
            font-weight: 600;
        }

        .creator-credit {
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 1px;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 5;
            scroll-behavior: smooth;
        }

        .chat-container::-webkit-scrollbar {
            width: 4px;
        }
        .chat-container::-webkit-scrollbar-thumb {
            background: var(--border-glass);
            border-radius: 4px;
        }

        .message {
            max-width: 82%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.88rem;
            line-height: 1.45;
            backdrop-filter: blur(10px);
            word-wrap: break-word;
            z-index: 5;
        }

        .message.ai {
            background: var(--glass-bg);
            border: 1px solid var(--border-glass);
            color: #f1d3fe;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .message.ai a {
            color: var(--neon-pink);
            font-weight: bold;
            text-decoration: underline;
        }

        .message.user {
            background: linear-gradient(135deg, #7b2cbf, #c77dff);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(123, 44, 191, 0.4);
        }

        .input-bar {
            padding: 12px 15px;
            background: rgba(10, 2, 20, 0.95);
            backdrop-filter: blur(15px);
            border-top: 1px solid var(--border-glass);
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .chat-input {
            flex: 1;
            background: rgba(25, 10, 45, 0.9);
            border: 1px solid var(--border-glass);
            padding: 12px 16px;
            border-radius: 25px;
            color: white;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .chat-input:focus {
            border-color: var(--neon-pink);
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.3);
        }

        .send-btn {
            background: linear-gradient(45deg, #7b2cbf, #ff007f);
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(255, 0, 127, 0.5);
            flex-shrink: 0;
        }

        .send-btn:active {
            transform: scale(0.9);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Background Watermark Mascot -->
        <div class="mascot-bg"></div>

        <div class="top-header">
            <div class="brand-title">NOVA AI</div>
            <div class="tagline">System Online. Ready for Chaos. ⚡</div>
            <div class="creator-credit">Created by Tony RaoSahab</div>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="message ai">
                Yo! Main NOVA hoon, teri personal Gen-Z AI companion. Bata aaj kya dimaag ka dahi karna hai ya koi serious sawaal hai? 😎
            </div>
        </div>

        <div class="input-bar">
            <input type="text" id="userInput" class="chat-input" placeholder="Type your command to NOVA..." autocomplete="off">
            <button class="send-btn" id="sendBtn">➤</button>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        let messageHistory = [];

        async function handleSendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            userInput.value = '';
            scrollToBottom();

            messageHistory.push({ role: "user", content: text });

            const loadingId = appendMessage("NOVA is cooking...", 'ai loading');
            scrollToBottom();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: messageHistory })
                });

                const data = await response.json();
                
                const loadingElem = document.getElementById(loadingId);
                if (loadingElem) loadingElem.remove();

                if (data.reply) {
                    appendHtmlMessage(data.reply, 'ai');
                    messageHistory.push({ role: "model", content: data.reply });
                } else if (data.error) {
                    appendMessage(`⚠️ Error: ${data.error}`, 'ai');
                } else {
                    appendMessage("Kuch gadbad ho gayi bhai!", 'ai');
                }

                scrollToBottom();

            } catch (error) {
                const loadingElem = document.getElementById(loadingId);
                if (loadingElem) loadingElem.remove();
                appendMessage("Server ke sath connection toot gaya!", 'ai');
                scrollToBottom();
            }
        }

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            const msgId = 'msg_' + Date.now() + Math.random().toString(36).substr(2, 4);
            msgDiv.id = msgId;
            msgDiv.className = `message ${sender}`;
            msgDiv.textContent = text;
            chatContainer.appendChild(msgDiv);
            return msgId;
        }

        function appendHtmlMessage(html, sender) {
            const msgDiv = document.createElement('div');
            const msgId = 'msg_' + Date.now() + Math.random().toString(36).substr(2, 4);
            msgDiv.id = msgId;
            msgDiv.className = `message ${sender}`;
            msgDiv.innerHTML = html;
            chatContainer.appendChild(msgDiv);
            return msgId;
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        sendBtn.addEventListener('click', handleSendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSendMessage();
        });
    </script>
</body>
</html>
